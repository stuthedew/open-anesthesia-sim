name: drift

# Does this project still build and pass on a toolchain nobody pinned?
#
# `quality.yml` answers the opposite question, and answers it well: it runs
# `uv sync --locked` on the interpreter `.python-version` names, so it proves
# the tree works on the toolchain that was current when the pins were written.
# That is what a gate should do. It also means every constraint in
# `pyproject.toml` goes untested against the world moving past it, and this
# project is on a multi-year horizon, which makes that drift a certainty rather
# than a risk (`PL-QSWS`).
#
# The failure this exists to prevent is not a stale pin. It is returning after
# a gap to a tree that no longer builds, where the upgrade that would fix it is
# now several versions wide and the cost of coming back exceeds what a hobby
# project will pay. Finding the break while the delta is one version wide is
# the whole value.
#
# **It reports; it does not gate.** It runs on a schedule and never on a pull
# request, so a red result here never blocks work in progress. That is
# deliberate: the versions it resolves are outside anyone's control, so gating
# on them would mean an unrelated upstream release could stop this project's
# own work, which is the tail wagging the dog.
#
# **If it goes red routinely and nobody acts, retire it.** `CLAUDE.md`'s
# retirement test applies here as much as anywhere: a check that fires every
# run without changing a decision is a defect in the check. A red result should
# be news. If it becomes weather, this file is the thing to delete, not the
# thing to work around.
#
# The `order` job at the end asks a different question, whether any test
# depends on the order the tests run in. It shares this file for its schedule
# and its report-only stance, and its own comment explains it (`PL-75D9`).
on:
  schedule:
    # 06:00 UTC on the first of the month. Monthly rather than weekly because
    # the signal is "something moved", and at a weekly cadence most runs would
    # say nothing while still costing a look. CPython ships annually and the
    # libraries here move in weeks, so a month is short enough that a break is
    # still one version wide when it is found.
    - cron: '0 6 1 * *'
    # 06:00 UTC each Monday, for the `order` job alone (`PL-75D9`). A new
    # order dependence between tests can arrive with any pull request, so it
    # is looked for weekly rather than monthly.
    - cron: '0 6 * * 1'
  # So the owner can run it on demand - before a long gap, on returning from
  # one, or to confirm a change to this file actually works.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Do the newest releases of our own declared dependencies still work?
  #
  # No constraint is edited here: `uv sync --upgrade` resolves the newest
  # version each bound in `pyproject.toml` allows. So this answers the question
  # inside the project's own stated policy, and a failure means a dependency
  # broke us within a range we already said we accept - which makes it
  # actionable without any judgment about whether to widen a bound.
  dependencies:
    # The monthly schedule and a manual run; the weekly one is `order`'s.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 1 * *'
    runs-on: ubuntu-latest
    # Both jobs here re-resolve every dependency (`--upgrade` ignores
    # `uv.lock`; setup-uv still restores its download cache, which a run on
    # 2026-10-18 showed) and then run the suite, so they are slower than
    # `quality.yml`'s and have no measured baseline - this workflow runs
    # monthly. 30 minutes is chosen to be past any plausible honest run rather
    # than tight, because the failure being bounded is a hang, not slowness.
    # `PL-FSH9`.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # `quality.yml`'s step and its reason: Qt's offscreen platform plugin
      # links `libEGL.so.1`, which `ubuntu-latest` does not carry, so every
      # test module importing `PySide6.QtGui` dies at collection without it
      # (`PL-VHLZ`). This file went without it until `PL-FPCK`, and its first
      # run after the Qt port failed on that alone.
      - name: Qt's system libraries, for the offscreen platform plugin
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - uses: astral-sh/setup-uv@v9.0.0

      # `--upgrade` rather than `--locked`: ignore uv.lock and re-resolve.
      - run: uv sync --upgrade --dev

      # What it actually resolved, so a red run below can be read without
      # re-running anything. `uv pip list` is the record of what was tested.
      - name: resolved versions
        run: uv pip list

      # `-n auto --dist worksteal`, and the two flags this line does *not*
      # carry are the point. `--cov --cov-fail-under=100` stays off: that
      # measures the project against its own policy, so a red run caused by it
      # would say nothing about dependencies, which is what this workflow is
      # for (`PL-22Z3`). `-n auto` is the opposite case and was left off with
      # it by association rather than by argument until `PL-55JM`.
      # `pytest-xdist` is a declared `dev` dependency, and `uv sync --upgrade
      # --dev` above resolves whatever xdist is newest and then never ran it -
      # a constraint upgraded and untested, which is the exact hole this
      # workflow's header says it exists to close. An xdist regression *is* a
      # dependency break, so a red run here is the news this job is built to
      # deliver.
      #
      # It also leaves execution topology matching `make test` rather than
      # differing from every other run in the project, so what this job varies
      # is dependency versions alone. Wall clock is not the argument - this
      # runs monthly, gates nothing and blocks nobody's iteration - though the
      # CI minutes are real on a private repository.
      - run: uv run pytest -n auto --dist worksteal
      - run: uv run mypy

      # Never fails, and that is the point. It reports what exists *beyond*
      # the upper bounds in `pyproject.toml` - the PySide6 7, pyqtgraph 0.15
      # or pydantic 3 that `--upgrade` cannot reach because this project
      # excludes it. (It read `flet 1.0` until `PL-3SQT` took Flet out of that
      # file; the example had to be a bound this project still declares.)
      # Crossing a major bound is a deliberate migration rather than
      # something CI should attempt, so this surfaces the option and stops.
      # Without it, nothing would ever mention that the migration had become
      # available.
      - name: newer releases outside our declared bounds
        continue-on-error: true
        run: uv pip list --outdated

  # Does the tree work on a CPython newer than the one it pins?
  #
  # `pyproject.toml` pins `requires-python = ">=3.14,<3.15"` - a single minor
  # version - and repeats that number in `[tool.ruff] target-version`,
  # `[tool.mypy] python_version` and `.python-version`. CPython ships a minor
  # release a year, so this pin is wrong within twelve months and several times
  # over this project's horizon.
  #
  # The upper bound has to be relaxed in the runner for the question to be
  # asked at all: uv refuses an interpreter outside `requires-python`, which is
  # correct for every other job here and is exactly what this one needs to see
  # past. The edit is confined to the runner's checkout and is never committed.
  interpreter:
    # The monthly schedule and a manual run; the weekly one is `order`'s.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 1 * *'
    runs-on: ubuntu-latest
    # Both jobs here re-resolve every dependency (`--upgrade` ignores
    # `uv.lock`; setup-uv still restores its download cache, which a run on
    # 2026-10-18 showed) and then run the suite, so they are slower than
    # `quality.yml`'s and have no measured baseline - this workflow runs
    # monthly. 30 minutes is chosen to be past any plausible honest run rather
    # than tight, because the failure being bounded is a hang, not slowness.
    # `PL-FSH9`.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # '3.x' asks for the newest stable CPython, which is the version this
      # job exists to try. Deliberately not read from `.python-version` - that
      # names the pinned interpreter, the one version this job is not testing.
      #
      # `check-latest` is what makes '3.x' mean the newest release rather than
      # the newest one the runner image happens to carry. It defaults to
      # false, and then setup-python takes the image's own copy. On 2026-10-18
      # that was 3.14.8, while `actions/python-versions` already listed 3.15.0
      # as stable, so the job tested the pinned series and said so (`PL-FPCK`).
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
          check-latest: true

      # The same step as the `dependencies` job's, for the same reason.
      - name: Qt's system libraries, for the offscreen platform plugin
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - uses: astral-sh/setup-uv@v9.0.0

      - name: relax the interpreter pin for this run only
        run: |
          set -euo pipefail
          # Recorded before `.python-version` is rewritten, so the step after the
          # sync can say whether this run actually reached past the pin. Without
          # it the job reports success identically whether it tested the next
          # CPython or the current one (`PL-CGSS`).
          echo "PINNED_MINOR=$(cut -d. -f1,2 < .python-version)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import pathlib, re, tomllib
          p = pathlib.Path("pyproject.toml")
          t = p.read_text(encoding="utf-8")
          relaxed = ">=3.14"
          new, n = re.subn(
              r'^requires-python = "[^"]*"$',
              f'requires-python = "{relaxed}"',
              t,
              count=1,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit(
                  "requires-python not found in the expected shape; this job's "
                  "assumption about pyproject.toml has gone stale - fix it here "
                  "rather than letting the job silently test the pinned version"
              )
          # Read back before writing: the line rewritten has to be the key TOML
          # reads, and the only change. A multi-line string can hold a line
          # shaped like it, which the pattern finds first while the pin stays
          # as it was (`PL-FCQP`).
          was, now = tomllib.loads(t), tomllib.loads(new)
          pin = now.get("project", {}).pop("requires-python", None)
          was.get("project", {}).pop("requires-python", None)
          if pin != relaxed or now != was:
              raise SystemExit(
                  "the line rewritten is not the key TOML reads, whose "
                  f"requires-python is {pin!r}: a multi-line string may hold a "
                  "line shaped like it - fix it here rather than letting the "
                  "job silently test the pinned version"
              )
          p.write_text(new, encoding="utf-8")
          PY
          # `.python-version` would otherwise win over the interpreter above.
          # It is rewritten to name that interpreter rather than deleted,
          # because it is a tracked file and a test asserts that the files git
          # lists exist (`PL-FPCK`).
          python3 -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])' > .python-version
          python3 --version

      - run: uv sync --upgrade --dev --python "$(which python3)"

      - name: resolved versions
        run: uv pip list

      # The job's green is meaningless without this. `3.x` asks for the newest
      # stable CPython, which for most of a release cycle *is* the pinned minor,
      # so a passing run proves the pin still works rather than that the next
      # interpreter does - and nothing in the output said which. Measured on the
      # first real run: `3.x` resolved to 3.14.7 against a pinned 3.14.7.
      #
      # Reported, never failed. "Nothing newer exists" is the expected state for
      # most of the year, and failing on it would leave the job red for months,
      # which is the routed-around outcome the retirement test forbids.
      - name: did this run reach past the pin?
        run: |
          set -euo pipefail
          resolved="$(uv run python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          full="$(uv run python -c 'import sys; print(sys.version.split()[0])')"
          if [ "$resolved" = "$PINNED_MINOR" ]; then
            line="No newer CPython exists yet. Tested ${full}, which is the pinned ${PINNED_MINOR} series. This run confirms the pin still works and is not evidence about the next interpreter."
          else
            line="Tested past the pin: resolved ${full} against a pinned ${PINNED_MINOR}. Green here is evidence that requires-python's upper bound can move; red is the next interpreter breaking this tree."
          fi
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      # Same flags and the same reasoning as the `dependencies` job's pytest
      # line above, which carries it in full. `PL-55JM`.
      - run: uv run pytest -n auto --dist worksteal

  # Does any test pass only because of the tests that ran before it?
  #
  # Every other run keeps one order: pytest's file order, dealt to workers by
  # `--dist worksteal` in contiguous slices. A test that relies on what an
  # earlier test left behind passes there forever, and a test that fails only
  # when it runs before another is never tried. This job shuffles the order
  # with pytest-randomly, which `pyproject.toml`'s `addopts` turns off
  # everywhere else (`PL-75D9`). The seed is the date, so each week tries a new
  # order and a red run names the seed in its header. To reproduce one, run
  # `uv run pytest -n 4 --dist worksteal -p randomly --randomly-seed=SEED`,
  # with the worker count the runner had, since the order a worker meets
  # depends on how many workers share the collection.
  #
  # It reports and gates nothing, like the rest of this file. A red result
  # names two tests that share state, and that is a defect in one of them.
  order:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-latest
    # The same bound as the jobs above, chosen past any honest run because
    # the failure being bounded is a hang. This one installs from the lock
    # rather than re-resolving, so it is faster than they are.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # The same step as the `dependencies` job's, for the same reason.
      - name: Qt's system libraries, for the offscreen platform plugin
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - uses: astral-sh/setup-uv@v9.0.0

      # `--locked`, unlike the jobs above: this job varies the order alone,
      # so the versions are the ones every other run tests.
      - run: uv sync --locked --dev

      - run: uv run pytest -n auto --dist worksteal -p randomly --randomly-seed="$(date -u +%Y%m%d)"
