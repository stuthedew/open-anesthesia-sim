name: mac-probe
on:
  push:
    branches: [claude/project-thread-fwpg6m]
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --locked --dev
      - run: uv run python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); print(app.platformName(), app.font().family(), app.style().name())"
        env:
          QT_QPA_PLATFORM: cocoa
      - run: uv run pytest -q -p no:cacheprovider -p dont_show tests/integration/test_area_header_page_scroll.py tests/integration/test_compartment_schematic_view.py
        env:
          QT_QPA_PLATFORM: cocoa
          PYTHONPATH: .github/mac_probe
