name: quality

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      # No `python-version:` input on purpose. It sets UV_PYTHON, which
      # overrides `.python-version`, so CI would resolve its own interpreter
      # instead of the pinned one. The interpreter is named once, in
      # `.python-version`, and `uv sync` installs it. uv's own version comes
      # from `required-version` in pyproject.toml, which this action reads.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - run: uv sync --locked --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      # No paths: `[tool.mypy] files` in pyproject.toml names what the gate
      # covers, and says why `tests/` is not in it.
      - run: uv run mypy
      - run: uv run pytest
      - run: bin/docket check
      - run: uv run python tools/doc_check.py check
