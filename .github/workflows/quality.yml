name: quality

# `push` is scoped to the default branch on purpose. Every branch here
# becomes a pull request, and once one is open an unscoped `push` fires
# alongside `pull_request`, running this job twice for the same commit. The
# `pull_request` event is the one worth keeping for a branch: it tests the
# merge result rather than the branch head, which is the question a reviewer
# is actually asking. Pushes to `main` stay covered by the `push` trigger.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same pull request makes the first run's answer
# irrelevant before it finishes. **What cancelling buys is the runner slot**: a
# superseded run holds one, and the push that matters queues behind it.
# Measured over an 18-hour window before this was added, 5 of 51 quality runs
# were superseded while still running.
#
# That reason is stated without reference to billing on purpose, and the reason
# for *that* is this comment's own history (`PL-CCLL`). It said the repository
# was public and runners free; `PL-SSQX` corrected it to private and billed,
# reading `"visibility": "private"` from the API; the project owner made the
# repository public hours later, and standard runners on a public repository
# are free and unlimited. Two flips in two days, and the setting lives in
# GitHub's settings where nothing in this tree can check it. So the argument
# rests on the slot, which holds under either answer, and the billing position
# is recorded once below rather than woven through the reasoning.
#
# As of 2026-09-06 the repository is **public**, so standard-runner minutes are
# free and the cost of a superseded run is the slot alone. While it was private
# they were billed against the account's monthly allowance, rounded up per job,
# which is the premise the folded floor section below still reasons from when
# it says a separate job "billed a whole minute for eight seconds" - true when
# written, and the argument for folding it survives on the concurrent-job cap
# regardless.
#
# **The repository was made public to stop the billing, not as a publication
# decision** (project owner, 2026-09-06: "I made it public before I wanted to
# so i wouldn't get billed for minutes"). Recorded here because it is the fact
# a session is most likely to get backwards: nothing about the CI setup is
# waiting on the repository being private again, and the human-facing pass
# `PL-XYRN` holds is deliberately not overdue - the owner is not advertising
# the project yet.
#
# **The guarantee is that every commit on `main` keeps its own run, and it
# takes both lines below to deliver it.** `cancel-in-progress` is conditional
# rather than a flat `true` because `github.ref` is `refs/pull/N/merge` under
# `pull_request`, where a superseded run should be cancelled, and
# `refs/heads/main` under the `push` trigger above, where cancelling would mean
# a merge landing while an earlier merge was still being verified silently
# drops that commit's only check. `PL-QD9K`.
#
# **The flag alone never delivered that, and this comment claimed otherwise
# from the day it was written** (`PL-SMN4`). `cancel-in-progress` governs the
# run already *in progress* and reaches nothing else. Behind that run a
# concurrency group holds exactly one *pending* run, and a newer arrival evicts
# the older one whatever the flag says.
#
# Measured over the 257 completed `main` push runs between this block landing
# on 2026-09-05 and 2026-09-16: **31 were cancelled, 12.1%** - alive between 8
# and 215 seconds, and every one of them reporting `total_count: 0` jobs, which
# is eviction while pending rather than the shape a hand cancellation leaves.
# So roughly one commit in eight on `main` got no whole-store `bin/docket check
# --verify` at all, and `tools/main_ci_status.py` passes over a cancelled run,
# so nothing said so. Run 2036 (`df3b1dec`) was the fix for a red `main`, which
# is the correlation worth pricing rather than the average rate: merges cluster
# during an outage, so the loss is likeliest exactly when the verdict matters
# most.
#
# **The `github.sha` segment is the fix.** It gives each `main` push a group of
# its own, so no two ever share one and there is no pending slot to be evicted
# from. `pull_request` keeps the shared per-ref lane its cancellation depends
# on: `github.sha` is the merge commit there and changes on every push, so
# putting it in that lane too would cancel nothing, which is the saving
# `PL-QD9K` measured at 5 superseded runs in 51. The flag is left conditional
# rather than flattened to `true` now that it is unreachable on `main`, so that
# editing the segment away degrades to this defect rather than to cancelling a
# `main` run mid-flight.
#
# **`queue: max` is the other shape and does not fit here.** It holds up to 100
# pending runs in FIFO order instead of one, reaching the same guarantee by
# serializing where this reaches it by separating. It cannot be combined with
# `cancel-in-progress: true`, and `queue` is a fixed `single | max` enum with
# no expression form - unlike `cancel-in-progress` beside it - so it cannot be
# scoped to `main` pushes while pull requests keep theirs. Read from
# SchemaStore's `github-workflow.json`, because `docs.github.com` and
# `github.blog` are both blocked by this container's egress proxy: treat it as
# the schema's declaration rather than as GitHub's own prose.
#
# `tests/unit/test_ci_concurrency.py` renders the group for a `main` push and
# for a pull request and holds both to what this comment claims.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # **This job's name is load-bearing outside the tree.** Branch protection
  # matches a required status check by name, so renaming or removing a job here
  # orphans the requirement: nothing reports it, and every pull request then
  # waits forever on a check that cannot arrive - pending rather than failing,
  # so it does not look like a break. `PL-D551` deleting the `floor` job did
  # exactly that (`PL-KPP1`). Change a job name only together with that setting.
  #
  # **This is now checked rather than only written down** (`PL-XZD0`).
  # `tools/required_checks_check.py` runs as a step in this job and reconciles
  # the two lists in both directions - a required name nothing reports, and a
  # reporting job nothing requires. Its docstring carries the decision and the
  # measurement behind it; the note above `pr-title.yml`'s job key points at
  # the same place rather than restating any of it.
  checks:
    runs-on: ubuntu-latest
    # The default is 360 minutes. `bin/docket check --verify` shells out to
    # every `ready` or `needs-decision` item's own `verify:` command - 216 of
    # them on 2026-09-22 - so a single item can introduce a hang that nothing
    # else here would bound. 15 rather than
    # twice the observed 3m44s: a cold uv cache and a slow runner both stretch
    # the honest case, and a timeout that fires on a healthy run is a defect
    # in the timeout rather than a saving. `PL-FSH9`.
    timeout-minutes: 15

    steps:
      # `fetch-depth: 0` rather than the action's default of 1, because three
      # checks here need history and were silently not running without it.
      # `bin/docket check` declines the recorded-pull-request read on a
      # truncated clone, `tools/doc_check.py` declines the release-tag read,
      # and the missing-`pr` read - which does not decline - reported correct
      # provenance as lost, turning `main` red on 97573ae and 3b37a75 for a
      # number recoverable from a commit the depth-1 clone no longer held.
      # `PL-99Y4` fixed that conflation at the source; this is the other half,
      # giving the checks somewhere they can actually answer. Measured on the
      # full history first: all three go from "not checked" to passing, so
      # this adds coverage rather than failures. 0 fetches tags too, which is
      # what the release-tag read wants.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Qt's offscreen platform plugin links `libEGL.so.1`, which
      # `ubuntu-latest` does not carry; without it the first
      # `import PySide6.QtGui` in the suite dies at collection (`PL-VHLZ`).
      # `libgl1`, `libxkbcommon0`, `libdbus-1-3` and `libfontconfig1` - the
      # rest of what the PySide6 wheels expect from the OS - are already on the
      # runner image. Installed here, before the floor section below, because
      # it is an OS package rather than a toolchain: nothing about the
      # no-virtualenv proof that section makes depends on which shared
      # libraries the runner carries.
      - name: Qt's system libraries, for the offscreen platform plugin
        run: sudo apt-get update && sudo apt-get install -y libegl1

      # The floor section, and it runs FIRST - before uv exists on this runner.
      #
      # `tools/` and `subprojects/docket/` promise to run under a bare `python3`
      # with no virtualenv and no install step; that is why they depend on
      # nothing outside the standard library, and `make check` runs the ones
      # that parse no project source exactly that way. This was a separate `floor` job until
      # `PL-D551`, which merged it here: it billed a whole minute for eight
      # seconds of work, and a job is also a slot against the account's
      # concurrent-job cap, which is what throttles parallel sessions once
      # minutes stop being the binding constraint.
      #
      # **Order is the whole design.** Running these before `astral-sh/setup-uv`
      # makes the no-virtualenv claim stronger than the separate job did rather
      # than weaker: that job merely *assumed* isolation from a parallel one,
      # while here no virtualenv and no `UV_*` variable exists yet to leak from.
      # It also fails fast - a broken doc reference costs one billable minute
      # instead of five, because the suite below never starts. Anything moved
      # above this section that installs a toolchain silently voids the proof.
      #
      # Both portability suites stay. They run before a push, they name the
      # offending file and import where a traceback here would not, and they
      # reach a file or a lazily-imported branch these commands never touch.
      # What this performs is the run itself, which settles imports, syntax and
      # runtime behavior together and needs no allowlist kept current as the
      # standard library moves.

      # `python-version:` is set here rather than inherited, which is the
      # opposite of the choice made for `setup-uv` below and for the same
      # reason. Left unset, the action reads `.python-version` - the project
      # interpreter, the one version this section exists not to test. The floor
      # itself is not chosen here either: it is what
      # `subprojects/docket/pyproject.toml` declares in `requires-python`, and
      # `tests/unit/test_tools_portability.py` holds this pin to it so the two
      # cannot drift. It is also the file's only concrete `python-version:`
      # pin, which that suite asserts, so a second one added anywhere here
      # fails it rather than silently splitting the floor in two.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - run: python3 tools/doc_check.py check
      # Beside `doc_check` because it imports it and asks the notation half of
      # its question, which is the order the Makefile runs them in too. Both
      # read source docstrings as well as Markdown, so here they prove only that
      # they run with no virtualenv: each names on a "Not checked" line the
      # files this 3.11 parser cannot read, and passes. Both are repeated under
      # `uv run` below, which is the run that checks those files (`PL-MB3F`).
      - run: python3 tools/possessive_section_check.py
      - run: python3 tools/branch_id_check.py
      - run: python3 tools/rules_paths_check.py
      # 0.07 s, and it reads two files. It was `make check`-only from
      # 2026-09-13, which meant the cap on the always-loaded session-start
      # context - paid by every session, forever, once an entry is added
      # without a thought for it - was enforced only where somebody remembered
      # to run the local gate. `tools/doc_check.py`'s `check_gate_parity`
      # refuses that asymmetry now rather than leaving it to be noticed
      # (`PL-PBP5`).
      - run: python3 tools/dead_ends.py check
      # Bare, unlike the `--verify` line further down: nothing has installed
      # `uv` at this point in the job, so every `verify:` command would be "not
      # found" and the replay would decline rather than answer. What is being
      # proved here is that the command runs at all under the 3.11 floor with
      # no virtualenv. (This said "unlike the `checks` job above" until
      # `PL-L17Q`, which was true of the separate `floor` job `PL-D551` folded
      # in and false of the section that replaced it.)
      - run: bin/docket check

      # No `python-version:` input on purpose. It sets UV_PYTHON, which
      # overrides `.python-version`, so CI would resolve its own interpreter
      # instead of the pinned one. The interpreter is named once, in
      # `.python-version`, and `uv sync` installs it. uv's own version comes
      # from `required-version` in pyproject.toml, which this action reads.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - run: uv sync --locked --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      # No paths: `[tool.mypy] files` in pyproject.toml names what the gate
      # covers, and says why `tests/` is not in it.
      - run: uv run mypy
      # The other half of that answer, and it has to run *after* the line above
      # rather than in the floor section, for two separate reasons. It shells
      # out to mypy, so it needs the virtualenv the floor section exists to
      # prove is unnecessary; and it analyses the trees `[tool.mypy] files`
      # excludes, so the run above has already put everything they import into
      # `.mypy_cache`. Measured on this tree, four cores: 27.3 s from a cold
      # cache against 9.2 s straight after `uv run mypy`. Reversing the two
      # lines would triple its bill and prove nothing extra (`PL-PBP5`).
      - run: uv run python tools/ignore_check.py
      # The same invocation as `make check`'s pytest line, and it has to stay
      # the same: `core/` is at 100% of statements and branches, and this is
      # what keeps it there. See the comment in the Makefile for why the
      # threshold and the worker count are on the command line rather than in a
      # config table, and for the measurements behind the width.
      #
      # The width is computed here rather than pinned for the reason `-n auto`
      # was: it has to read this runner rather than carry one box's core count.
      # The expression differs from the Makefile's by one `$` only, because Make
      # doubles it to pass one through to the shell. `tools/doc_check.py`'s
      # `check_coverage_gate` compares the two lines and now collapses that
      # escape before it does, so the difference is not read as a drift while
      # every other difference still is (`PL-D3M2`, `PL-VZ8P`).
      # `drift.yml` runs the suite without `--cov`, and that is one decision
      # rather than two. `--cov-fail-under=100` measures the project against
      # its own policy, so a coverage failure in a dependency workflow would
      # report as a dependency break, which is the opposite of what that
      # workflow is for (`PL-22Z3`). Parallelism goes the other way and was
      # only ever off there by association with it: `pytest-xdist` is a
      # declared dependency that job upgrades and was never running, so
      # `PL-55JM` put `-n auto --dist worksteal` on both of its pytest lines.
      - run: uv run pytest -n $(python3 -c 'import os; print(os.cpu_count() * 2)') --dist worksteal --cov=anesthesia_sim.core --cov-branch --cov-fail-under=100
      # `--verify` replays every open item's own `verify:` command. It used to
      # be unconditional, which meant `make check` paid about 31 s per run for a
      # finding about work that had already *merged* - see the Makefile's note
      # on the same command. The flag moves the bill here without moving the
      # coverage: this is the job and these are the events it ran on before
      # (`PL-P3B6`). CI wall clock is not what that item was optimizing.
      #
      # It is now, and the two steps below are one decision (`PL-SDHR`).
      # Measured on run 33998014593: the sweep was **87 s of this job's 152 s**,
      # more than the whole 1820-test suite, because 111 open items carry a
      # command and 79 of them start a fresh `uv run pytest`. That bill grows
      # with the size of the queue rather than with the size of the change, and
      # it is paid on every push to every open pull request.
      #
      # So the scope follows the event, which is `PL-P3B6`'s own argument one
      # step on. That item took the replay off `make check` because a
      # pre-commit gate cannot have changed whether some *other* item's work
      # merged - and neither can a pull request. What a branch can have changed
      # is two sets, both read from the diff by `--verify-base`: the items it
      # edited, and the open items whose `verify:` command reads a file it
      # edited (`PL-XMNC` - the second is the command a branch *invalidates*,
      # which every one of six recorded breaks was and which the first replays
      # never). The findings a session can act on - "you finished this item's
      # work and left it open", "you have just stopped this command
      # discriminating" - are kept; the rest of the store is not a pull
      # request's question.
      #
      # **`make check` runs this scoped form too, since `PL-0HPV`**, against
      # `origin/main`, so what this step finds reaches a session before it
      # pushes rather than as a red run here. It was the commonest failing
      # step: 20 of the 56 failed `pull_request` runs from 2026-09-10 to
      # 2026-09-22, a median of 8 minutes each before a fix was green. It stays,
      # because a branch pushed without a local `make check` is still gated
      # here - the reason the two lists are reconciled rather than merged
      # (`PL-PBP5`). The whole-store step below does not join it, for the
      # reason the Makefile gives beside the same command.
      #
      # The whole-store sweep still runs on every push to the default branch,
      # which is where it is a fact about `main` rather than about a branch. A
      # scoped run says what it was scoped to on `docket check`'s own cost
      # line, including when the scope held nothing, so a narrowed answer can
      # never be read as a clean whole-store one.
      #
      # Two steps rather than one job, deliberately: this job's name is
      # load-bearing for branch protection (see the note on `checks:` above), so
      # the alternative of splitting the sweep into a parallel job would have
      # orphaned a required check as well as buying a second rounded-up minute.
      - name: verify replay, scoped to what this branch changed
        if: github.event_name == 'pull_request'
        # Through the environment rather than a `${{ }}` interpolation in the
        # `run:` line, as in `pr-title.yml` and for the same reason.
        env:
          VERIFY_BASE: origin/${{ github.base_ref }}
        run: bin/docket check --verify --verify-base "$VERIFY_BASE"
      - name: verify replay, the whole store
        if: github.event_name != 'pull_request'
        run: bin/docket check --verify
      # Repeated from the floor section above, unlike the seven lines after
      # them. `branch_id_check.py` reads `git log` and the branch name, never
      # project source, so the 3.11 parser has nothing it cannot read
      # (`PL-CP74`). The other two read every module's docstrings for the
      # citations in them, and the floor declines the files it cannot parse, so
      # these are the runs that check them (project owner, 2026-09-24,
      # ratified, over leaving the possessive check at the floor alone, where
      # no gate read `app/bookmarks.py` or `app_metadata.py`, `PL-MB3F`).
      - run: uv run python tools/branch_id_check.py
      - run: uv run python tools/doc_check.py check
      - run: uv run python tools/possessive_section_check.py
      # Deliberately absent from the floor section above, all seven of them, for
      # a reason about the *input* rather than about the tool. That section runs
      # the tools under the 3.11 floor to prove they need no virtualenv; these
      # seven read `app/`, `src/anesthesia_sim/`, `src/anesthesia_sim/core/`,
      # `src/anesthesia_sim/data/` and `tests/` with `ast`, and that source
      # targets 3.14, so the 3.11 parser
      # cannot read what they are given - a `SyntaxError` on
      # `app/bookmarks.py`'s PEP 695 generics rather than anything
      # about the tool. `ast.parse`'s `feature_version` cannot help: it only
      # ever narrows the syntax accepted, so it cannot teach an older parser a
      # newer language.
      #
      # `contrast_check.py` ran at the floor until `PL-L17Q`, and was green only
      # because `app/theme.py` and `app/simulation_view.py` happened to contain
      # no 3.12+ syntax. One PEP 695 generic added to either would have turned
      # this whole job red before uv was even installed, naming a tool whose
      # author had touched nothing. The rule that generalizes it is in
      # `tests/unit/test_tools_portability.py`'s docstring, and the Makefile
      # carries the same note on the same seven lines. `glyph_check.py` joined
      # them under `PL-8XPQ`, reading the same trees for the same reason.
      # `fixture_id_check.py` joined them under `PL-7922` with the broadest
      # input of the group - every `*.py` in the repository - which is the same
      # argument `workflow_paths_check.py` makes about `tests/`.
      # `PL-Y0RZ`, `PL-L17Q`, `PL-JBZK`, `PL-97VB`, `PL-FZ6T`, `PL-8XPQ`,
      # `PL-7922`.
      - run: uv run python tools/contrast_check.py
      - run: uv run python tools/agent_identity_check.py
      - run: uv run python tools/import_boundary_check.py
      - run: uv run python tools/workflow_paths_check.py
      - run: uv run python tools/core_vocabulary_check.py
      - run: uv run python tools/glyph_check.py
      - run: uv run python tools/fixture_id_check.py

      # Deliberately not in the floor section above, and deliberately run once
      # rather than twice, for a reason about its *input*: it is the only check
      # here whose answer is not in the tree at all. It reads the required
      # status checks off the GitHub API and reconciles them against the jobs
      # this repository's workflows would report, so it proves nothing about
      # interpreter portability and it costs an HTTP round trip that should not
      # be paid a second time. `tests/unit/test_tools_portability.py` still
      # holds the file itself to the 3.11 floor, by directory, as it does every
      # other script under `tools/`.
      #
      # A step rather than a job of its own, which is not a style preference:
      # a new job reports a new status check, which would itself have to be
      # added to the required list - the exact trap `PL-H8YD` records. As a
      # step it inherits the requirement this job already carries, so the check
      # that guards the list adds no entry to it.
      #
      # `GITHUB_TOKEN` buys rate limit and nothing else. Every endpoint it
      # reads answers unauthenticated on a public repository, which is what
      # decided `PL-XZD0` in favour of building this at all - the branch
      # protection endpoint the item expected to need is closed to an Actions
      # token forever, because `administration` is not a permission a workflow
      # may request.
      - name: reconcile the required status checks against the jobs that report them
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/required_checks_check.py

      # The pull-request title check lived here and moved to its own workflow,
      # `.github/workflows/pr-title.yml`, under `PL-3V8K`: it has to run on
      # `pull_request: edited` so that renaming a title can clear it, and
      # adding `edited` to this trigger would re-run everything above on every
      # body edit.
      #
      # `PL-D551` folded the `floor` job into this one and deliberately stopped
      # there. Folding the title check back in as well - which `PL-9HDH`
      # proposed, to reclaim its billable minute - would restore exactly the
      # defect `PL-3V8K` and `PL-0ZP8` both diagnosed: this trigger excludes
      # `edited`, so the rename the check asks for would fire no event and
      # could never clear the failure it caused. One billable minute is the
      # correct price for that, and `PL-9HDH` is dropped saying so.

