name: quality

# `push` is scoped to the default branch on purpose. Every branch here
# becomes a pull request, and once one is open an unscoped `push` fires
# alongside `pull_request`, running this job twice for the same commit. The
# `pull_request` event is the one worth keeping for a branch: it tests the
# merge result rather than the branch head, which is the question a reviewer
# is actually asking. Pushes to `main` stay covered by the `push` trigger.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      # `fetch-depth: 0` rather than the action's default of 1, because three
      # checks here need history and were silently not running without it.
      # `bin/docket check` declines the recorded-pull-request read on a
      # truncated clone, `tools/doc_check.py` declines the release-tag read,
      # and the missing-`pr` read - which does not decline - reported correct
      # provenance as lost, turning `main` red on 97573ae and 3b37a75 for a
      # number recoverable from a commit the depth-1 clone no longer held.
      # `PL-99Y4` fixed that conflation at the source; this is the other half,
      # giving the checks somewhere they can actually answer. Measured on the
      # full history first: all three go from "not checked" to passing, so
      # this adds coverage rather than failures. 0 fetches tags too, which is
      # what the release-tag read wants.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # No `python-version:` input on purpose. It sets UV_PYTHON, which
      # overrides `.python-version`, so CI would resolve its own interpreter
      # instead of the pinned one. The interpreter is named once, in
      # `.python-version`, and `uv sync` installs it. uv's own version comes
      # from `required-version` in pyproject.toml, which this action reads.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - run: uv sync --locked --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      # No paths: `[tool.mypy] files` in pyproject.toml names what the gate
      # covers, and says why `tests/` is not in it.
      - run: uv run mypy
      # The same invocation as `make check`'s pytest line, and it has to stay
      # the same: `core/` is at 100% of statements and branches, and this is
      # what keeps it there. See the comment in the Makefile for why the
      # threshold is on the command line rather than in a config table.
      # `drift.yml` deliberately keeps its bare `uv run pytest`: a coverage
      # failure there would report as a dependency break, which is the opposite
      # of what that workflow is for. `PL-22Z3`.
      #
      # `-n auto` reads the runner it lands on rather than naming a number,
      # and here that is load-bearing rather than tidy: GitHub's standard Linux
      # runner is four vCPUs on a public repository and two on a private one,
      # this repository is private, and the log confirms `auto` picked
      # `2/2 workers`. A hardcoded `-n 4` - the number this was measured at
      # locally - would put four workers on two cores every run. Measured on
      # the `checks` job: the step goes 67 s serial to 49 s, 27%, against 65%
      # on the four-core dev container; two cores buy less, and the figure
      # improves on its own if this repository is ever made public.
      #
      # `drift.yml` keeps its bare `uv run pytest` - it reports rather than
      # gates and runs monthly, so its wall clock buys nothing. `PL-WCZV`.
      - run: uv run pytest -n auto --cov=anesthesia_sim.core --cov-branch --cov-fail-under=100
      - run: bin/docket check
      - run: uv run python tools/doc_check.py check
      - run: uv run python tools/contrast_check.py

      # The pull-request title check lived here and moved to its own workflow,
      # `.github/workflows/pr-title.yml`, under `PL-3V8K`: it has to run on
      # `pull_request: edited` so that renaming a title can clear it, and
      # adding `edited` to this trigger would re-run everything above on every
      # body edit.

  # The other half of what `checks` proves, and the half that was missing.
  # Everything above runs under the virtualenv on the interpreter
  # `.python-version` pins. But `tools/` and `subprojects/docket/` promise to
  # run under a bare `python3` with no virtualenv and no install step - that is
  # why they depend on nothing outside the standard library, and `make check`'s
  # last two lines are exactly that invocation. Nothing here exercised it:
  # `checks` reaches doc_check through `uv run python`, and `bin/docket check`
  # through whatever system python the runner image happens to ship, neither of
  # them the declared floor.
  #
  # So both portability suites were approximating a run CI never performed -
  # `tests/unit/test_tools_portability.py` gating syntax through
  # `ast.parse(feature_version=...)` and reading the wrong interpreter's
  # `sys.stdlib_module_names`, `subprojects/docket/tests/test_portability.py`
  # keeping an import allowlist by hand. This job performs the run instead,
  # which settles imports, syntax and runtime behavior together and needs no
  # list kept current as the standard library moves.
  #
  # The suites stay. They run before a push, they name the offending file and
  # import where a traceback here would not, and they reach a file or a
  # lazily-imported branch these two commands never touch.
  floor:
    runs-on: ubuntu-latest

    steps:
      # `fetch-depth: 0` rather than the action's default of 1, because three
      # checks here need history and were silently not running without it.
      # `bin/docket check` declines the recorded-pull-request read on a
      # truncated clone, `tools/doc_check.py` declines the release-tag read,
      # and the missing-`pr` read - which does not decline - reported correct
      # provenance as lost, turning `main` red on 97573ae and 3b37a75 for a
      # number recoverable from a commit the depth-1 clone no longer held.
      # `PL-99Y4` fixed that conflation at the source; this is the other half,
      # giving the checks somewhere they can actually answer. Measured on the
      # full history first: all three go from "not checked" to passing, so
      # this adds coverage rather than failures. 0 fetches tags too, which is
      # what the release-tag read wants.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # `python-version:` is set here rather than inherited, which is the
      # opposite of the choice above and for the same reason. Left unset, the
      # action reads `.python-version` - the project interpreter, the one
      # version this job exists not to test. The floor itself is not chosen
      # here either: it is what `subprojects/docket/pyproject.toml` declares in
      # `requires-python`, and `tests/unit/test_tools_portability.py` holds
      # this pin to it so the two cannot drift.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - run: python3 tools/doc_check.py check
      - run: bin/docket check
      - run: python3 tools/contrast_check.py
