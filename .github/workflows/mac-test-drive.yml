# Throwaway, on a thread branch only: check on a macOS runner, in macOS's own
# font and style, that the Maintenance schematic shows whole at 1366 by 768
# (PL-H100). Removed before the pull request merges.
name: mac-test-drive
on:
  push:
    branches: [claude/project-thread-fe9sxd]
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: sw_vers
      - name: Sweep window heights in the macOS style
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: cocoa
        run: uv run python .github/mac-test-drive/sweep.py
      - name: Sweep window heights at a Retina scale of 2
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: cocoa
          QT_SCALE_FACTOR: "2"
        run: uv run python .github/mac-test-drive/sweep.py
      - name: Layout tests under cocoa, windows kept at their size
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: cocoa
          PYTHONPATH: .github/mac-test-drive
        run: uv run pytest -q -p no:cacheprovider -p dont_show_on_screen tests/integration/test_compartment_schematic_view.py tests/integration/simulation_view/test_simulation_view_page.py
      - name: The schematic shows whole at each lesson size under cocoa
        env:
          QT_QPA_PLATFORM: cocoa
          PYTHONPATH: .github/mac-test-drive
        run: uv run pytest -v -p no:cacheprovider -p dont_show_on_screen tests/integration/simulation_view/test_simulation_view_page.py -k "lesson_whole or leaves_room_for_macos"
