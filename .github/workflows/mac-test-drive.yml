# Throwaway, on a thread branch only: draw the v0.7.0 schematic on a macOS
# runner in macOS's own font and check that every label fits and the pinned
# lines stay in view. Never merged.
name: mac-test-drive
on:
  push:
    branches: [claude/project-thread-m4oy26]
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: sw_vers; system_profiler SPDisplaysDataType | grep -iE "resolution|retina|looks like" || true
      - name: Probe under the native cocoa platform
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: cocoa
        run: mkdir -p "$RUNNER_TEMP/screens/cocoa" && uv run python .github/mac-test-drive/probe.py "$RUNNER_TEMP/screens/cocoa"
      - name: Probe offscreen with the macOS system font
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          PROBE_SYSTEM_FONT: "1"
        run: mkdir -p "$RUNNER_TEMP/screens/offscreen" && uv run python .github/mac-test-drive/probe.py "$RUNNER_TEMP/screens/offscreen"
      - name: Layout tests under the native cocoa platform
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          uv run pytest -q -p no:cacheprovider tests/integration/test_compartment_schematic_view.py tests/integration/test_agent_cost_view.py tests/integration/test_qt_rendering.py tests/integration/simulation_view/test_simulation_view_page.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: mac-screens
          path: ${{ runner.temp }}/screens/
