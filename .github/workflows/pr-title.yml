name: pr-title

# Split out of `quality.yml` deliberately (`PL-3V8K`). This check tells an
# author to rename the pull request, and a rename is a `pull_request: edited`
# event, which the default trigger types do not include. So doing exactly what
# the check asks could not clear it: the failed run stayed failed on the head
# commit, and the only remedy left was pushing a commit, which the working
# agreement forbids doing to kick CI. Observed on #256.
#
# Adding `edited` to `quality.yml`'s own trigger would have fixed that by
# re-running sync, ruff, mypy, the whole test suite, docket, doc_check and
# contrast on every title *and body* edit - including the body edits made while
# iterating on a description. This job reads one string and one `git log`, so it
# is its own workflow instead.
#
# No uv and no virtualenv: `tools/` runs under a bare `python3` by contract,
# which `tests/unit/test_tools_portability.py` and `quality.yml`'s floor
# section - the steps `checks` runs before `setup-uv` - hold it to. That is
# what makes the split cheap - a checkout and one script, with no dependency
# resolution in front of it.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# `synchronize` and `edited` both fire here, and a description edit made while
# a push is still being checked would otherwise run this twice concurrently on
# the same head. Unconditional `cancel-in-progress` is safe in a way it is not
# in `quality.yml`: this workflow never runs on `push`, so there is no `main`
# lane to protect. `PL-QD9K`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # **This job's name is load-bearing outside the tree**, exactly as
  # `quality.yml`'s `checks` is - and those two are the whole set, because they
  # are the only jobs here that report a status check to a pull request at all
  # (`drift.yml` runs on a schedule and never on `pull_request`). Branch
  # protection matches a required status check by name, so renaming one orphans
  # the requirement. Change a job name only together with that setting.
  #
  # **The rule and the remedy are not restated here** (`PL-XZD0`). Both
  # directions - a required name nothing reports, and a reporting job nothing
  # requires - are reconciled in CI by `tools/required_checks_check.py`, whose
  # docstring is the single place the decision, the two regressions and the
  # measurement behind them are written down. Two copies of that reasoning is
  # what this file and `quality.yml` used to carry, and they had already drifted
  # apart: each described the direction its own regression had taken and neither
  # described the other.
  #
  # What is genuinely local, and is here because it can be read from nowhere
  # else in the tree: **this job entered the required set on 2026-09-17, and was
  # not in it before** (project owner, on `PL-H8YD`). That gap was not a
  # decision and not an escape hatch. The title check began as a *step inside*
  # `quality.yml`'s `checks` job (`PL-2XTF`, `#227`), where the requirement on
  # `checks` already gated it; `PL-3V8K` (`#256`) moved it out into this
  # workflow so a rename could clear it, and that turned a step into a job. A
  # new job reports a new status check that nothing makes required by default,
  # so the gate was left behind by a correct fix to a different problem and
  # stayed lost for eleven releases - until `#654` merged three seconds after
  # `checks` went green with the only completed `pr-title` run a failure.
  pr-title:
    runs-on: ubuntu-latest
    # Observed at 12 seconds; one checkout and one standard-library script.
    # `PL-FSH9`.
    timeout-minutes: 5

    steps:
      # `fetch-depth: 0` because the script computes what this branch closes
      # from the `PR_BASE..HEAD` range, which needs history on both sides of it.
      # A depth-1 clone has neither and the range would be empty, which reads as
      # "closes nothing" and passes any title at all.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # The title reaches the script through the environment rather than a
      # `${{ }}` interpolation inside the `run:` line: it is attacker-controlled
      # text on a fork pull request, and pasting it into a shell command is the
      # standard Actions script-injection hole. `PR_BASE` names the merge
      # target, which the script compares against `HEAD` to find what this
      # branch actually closes.
      # `PL-79N5`. Dropping `uv` was right - this script is standard library
      # only - but it left the script under no pinned interpreter at all:
      # not `.python-version`, which `uv run python` used to give it inside
      # `checks`, and not the declared floor, because `quality.yml`'s floor
      # section runs a fixed list of `tools/` scripts - `doc_check.py` and
      # `bin/docket check` among them - and never this one. It ran on whatever
      # `ubuntu-latest` happened to ship. The floor is not chosen here: it is
      # what `subprojects/docket/pyproject.toml` declares in `requires-python`,
      # and `tests/unit/test_tools_portability.py` holds every concrete pin in
      # `.github/workflows/` to it, so this one cannot drift from that one.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: pull request title names the items it closes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: python3 tools/pr_title_check.py
