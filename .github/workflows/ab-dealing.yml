name: ab-dealing

# PL-4Z5Y's A/B test of the worksteal dealing hook in `tests/conftest.py`.
# Throwaway: this file and the hook's `PL_4Z5Y_AB_DEALING` switch are removed
# before pull request 1498 merges.
#
# Each job runs `quality.yml`'s pytest command twice on one runner, once with
# the dealing and once without, so the difference between the two arms is
# taken on the same machine and the fast/slow runner lottery cancels out. Half
# the jobs run the dealing first and half run it second, so a warm-cache
# advantage for the second arm also cancels. The two arms are separate steps,
# so each arm's time is its step's time in the Actions API.
#
# `push` only, and only when this file changes, so other pushes to the branch
# do not start it. A second sample is a re-run of the same workflow run.
on:
  push:
    branches: [claude/focused-volta-pt9iq4]
    paths: [.github/workflows/ab-dealing.yml]

permissions:
  contents: read

jobs:
  pair:
    runs-on: ubuntu-latest
    # Two pytest steps of up to about 9 minutes each on a slow runner.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4]
        first: [hook, nohook]
        include:
          - first: hook
            second: nohook
          - first: nohook
            second: hook
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Qt's system libraries, for the offscreen platform plugin
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      # Classes the runner the way `PL-4Z5Y`'s CI table does: 5 s or less is
      # fast, 7 s or more is slow.
      - run: uv run mypy
      # Imports every test module once, so neither arm pays for compiling
      # bytecode or for a cold page cache.
      - name: warm-up collection
        run: uv run pytest --collect-only -q > /dev/null
      - name: first arm, ${{ matrix.first }}
        env:
          PL_4Z5Y_AB_DEALING: ${{ matrix.first }}
        run: uv run pytest -n $(python3 -c 'import os; print(os.cpu_count() * 2)') --dist worksteal --cov=anesthesia_sim.core --cov-branch --cov-fail-under=100
      - name: second arm, ${{ matrix.second }}
        if: ${{ !cancelled() }}
        env:
          PL_4Z5Y_AB_DEALING: ${{ matrix.second }}
        run: uv run pytest -n $(python3 -c 'import os; print(os.cpu_count() * 2)') --dist worksteal --cov=anesthesia_sim.core --cov-branch --cov-fail-under=100
