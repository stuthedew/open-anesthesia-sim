# Quotations of Claude Code's documentation that this repository relies on.
#
# `tools/doc_quote_check.py` reads this file. For each entry it checks that the
# quoted text is still in `file`, and that it is still on the page
# https://code.claude.com/docs/en/<page>.md. Both checks ignore line wrapping,
# Markdown links and emphasis, backticks, comment markers and letter case, so
# write the quotation as plain text.
#
# Add an entry when a live file quotes one of these pages, and remove it with
# the quotation. A red `doc-quotes` job in `.github/workflows/drift.yml` means a
# page has changed under a quotation: read the page, then correct the
# quotation or withdraw the claim that rests on it (`PL-S7LT`).
#
# The entries are the quotations `PL-124X` compared on 2026-10-19, as
# corrected that day. That comparison had 16 strings. One, the WebFetch
# truncation limit, was dropped from its hook because the page no longer
# states it, so 15 remain.

