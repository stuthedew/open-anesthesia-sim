# This package is deliberately portable: the session-start hook runs it with
# whatever bare `python3` is on PATH, with no virtualenv and no install step,
# and `pyproject.toml` here declares `requires-python = ">=3.11"` to say so.
#
# The repository around it targets 3.14. Formatting this package to that target
# is not cosmetic - it rewrites the source into syntax older interpreters
# cannot parse. PEP 758 (3.14) makes the parentheses in
# `except (OSError, TimeoutError):` redundant, so a 3.14-targeted formatter
# removes them, and the result is a SyntaxError on 3.11. The hook swallows
# errors by design, so the only symptom is a session-start digest that silently
# stops appearing.
#
# So: inherit the repository's rules, and override the one setting that decides
# which syntax is emitted.
extend = "../../pyproject.toml"
target-version = "py311"
