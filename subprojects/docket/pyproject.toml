[project]
name = "docket"
version = "0.1.0"
description = "A backlog for projects worked by sessions that start with no memory of the last one."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
docket = "docket.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docket"]
