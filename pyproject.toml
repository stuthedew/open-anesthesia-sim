[project]
name = "anesthesia-sim"
version = "0.2.0"
description = "Open-source anesthesia simulation project"
readme = "README.md"
authors = [
    { name = "Stuart Feichtinger", email = "stuthedew@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "flet-charts>=0.86,<1.0",
    "flet[all]>=0.86,<1.0",
]

[project.scripts]
anesthesia-sim = "anesthesia_sim.app.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
target-version = "py314"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.14"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["flet_charts", "flet_charts.*"]
ignore_missing_imports = true
