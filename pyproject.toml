[project]
name = "anesthesia-sim"
version = "0.6.24"
# "volatile" here where `README.md` says "inhaled", deliberately rather than by
# drift: a package Summary describes the artifact, and this release models
# sevoflurane, isoflurane and desflurane only. README "What it does not
# simulate" records the split and why (`PL-XF89`).
description = "A deterministic simulator of volatile-anesthetic uptake and distribution, which can be used for teaching. Not a medical device: not for clinical prediction, dosing, or monitoring."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Stuart Feichtinger", email = "stuthedew@users.noreply.github.com" }
]
requires-python = ">=3.15,<3.16"

# The package's machine-readable statement of maturity, audience and subject.
# Every string below is an exact row of <https://pypi.org/classifiers/>, read
# 2026-09-06.
#
# **Nothing in this toolchain enforces that**, which is why the strings are
# verified against the published list by hand rather than trusted to the build.
# Measured 2026-09-06: `uv build` 0.12.7 built both artifacts from a
# `Development Status :: 3 - Alpah` typo without a warning, so a misspelling
# here ships in `PKG-INFO` and surfaces only at a PyPI upload this project does
# not perform. `PL-4MHK` records why that is not a check: five strings that
# change about once a release train do not earn a vendored copy of a 900-row
# list, and re-verifying them on every `make check` would be a check that never
# changes a decision.
#
# `Development Status :: 3 - Alpha` rather than `2 - Pre-Alpha`: a case runs
# end to end today - v0.4.0 shipped the teachable case and v0.4.4 the exact
# propagator - which is past the row that means "not yet functional". It is
# not `4 - Beta` because the MVP is still ahead (`ROADMAP.md` row 5, v0.5.0)
# and there is no packaged build, so the interfaces are still moving.
#
# Three families are deliberately absent rather than overlooked:
#
# - **No `License ::` row.** `license` above is an SPDX expression, which is the
#   form PEP 639 asks for and which ships as `License-Expression` in metadata
#   2.4. A license classifier beside it is not refused - measured the same day,
#   `uv build` warns "License classifiers are ambiguous and deprecated per PEP
#   639" and builds anyway - so its absence is a decision, not something the
#   backend imposed.
# - **No `Programming Language :: Python ::` rows.** `requires-python` directly
#   above states the interpreter range, and installers read that rather than a
#   classifier. A second copy would drift silently, which is the failure mode
#   the comments through the rest of this file are written against.
# - **No `Intended Audience :: Science/Research`.** `README.md` names two
#   readers - clinicians in anesthesiology and critical care, and contributors.
#   Claiming a research audience would imply the model has been validated for
#   inference about real patients, which is the kind of over-claim
#   `CLAUDE.md`'s presentation-correctness standard forbids. `Intended
#   Audience :: Education` stays because teaching is one of the simulator's
#   uses.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    # One toolkit, which is what finishing the port meant. Both were declared
    # here for the length of it: PySide6 and pyqtgraph entered with `PL-G59B`,
    # the chart, and `flet` stayed until the last module importing it was gone
    # (`ROADMAP.md` § "v0.4.26 - the interface moves to Qt", Required scope
    # items 1, 2 and 5). `PL-25KS` deleted that module, so the two lines below
    # went out with `PL-3SQT` - the subtractive half, taken after the tree
    # stopped needing them rather than on the schedule the item guessed.
    #
    # Nothing here is what keeps Flet out. `tools/import_boundary_check.py`
    # permits `flet` and `flet_charts` in no module under `src/` at all, so a
    # module reaching for either fails the build whatever this list says; a
    # dependency removed from a manifest is only a download saved.
    #
    # `PySide6-Essentials` rather than `PySide6`: the Essentials wheel is the
    # Qt modules this interface draws with (Core, Gui, Widgets) and none of
    # the Addons (WebEngine, Multimedia, 3D), which are the bulk of the full
    # distribution's download and are imported by nothing here.
    #
    # A floor of 6.12. PySide6 6.11.2 and 6.11.3 free a Python function
    # object inside Shiboken's lookup of a Python override of a C++ virtual,
    # and read it afterwards, so a dashboard whose draws walk Qt's focus
    # chain crashed with a segmentation fault (measured with valgrind on
    # 2026-11-22, on Python 3.14 and 3.15). 6.12.0 does not, and its release
    # notes list PYSIDE-3469, a crash from stale wrappers of layout items, and
    # the first support for Python 3.15, which this project requires
    # (https://doc.qt.io/qtforpython-6/release_notes/pyside6_release_notes.html,
    # read 2026-11-22; `PL-2D9Z`). The floor drops macOS 13: 6.12.0's macOS
    # wheels are built for macOS 14, and Qt 6.12 supports macOS 14.4 or later
    # (https://doc.qt.io/qt-6/macos.html, read 2026-11-22).
    "PySide6-Essentials>=6.12,<7.0",
    "pyqtgraph>=0.13.7,<0.15",
    # The chart hands pyqtgraph its points as `numpy.ndarray`s, which is the
    # form pyqtgraph's performance guidance asks for (`app/qt_chart.py`,
    # `PL-TCNT`). pyqtgraph installs numpy for itself, but a package this
    # project imports is one it declares. The tests use it too: the reference
    # tests decompose the model's open-circuit system into its exponential
    # modes with `numpy.linalg.eig`, LAPACK's validated solver (`PL-921Y`).
    # `tools/import_boundary_check.py` still refuses it under `core/`.
    "numpy>=2.5.3",
    # A floor, not an exact pin. pydantic 2.12.4 began passing
    # `prefer_fwd_module=` to `typing._eval_type`, a keyword CPython added
    # between 3.14.0rc2 and 3.14.0 final, so on the release candidate this
    # project used to run it raised `TypeError: _eval_type() got an
    # unexpected keyword argument 'prefer_fwd_module'` while evaluating the
    # deferred annotations in core/parameters.py (pydantic/pydantic#12501,
    # closed "not planned" upstream because the rc was never a supported
    # target). `.python-version` now names a final release, where 2.12.4 and
    # 2.13.5 both parse every shipped agent and patient file; the floor keeps
    # the broken pairing unreachable rather than pinning around it.
    "pydantic>=2.12.4,<3.0",
    # A cost is shown to its currency's minor unit, two decimals for USD and
    # none for JPY, as the Unicode CLDR's currency data gives it
    # (`docs/INTERFACE.md` § "Agent amounts in millilitres, and the cost",
    # `PL-7R8S`). Babel ships that data and keeps it current with each CLDR
    # release. Qt's `QLocale.toCurrencyString` takes the decimals from the
    # region instead of the currency, so it is not used. Only
    # `app/currency_code.py` imports Babel (`tools/import_boundary_check.py`).
    "babel>=2.18.0,<3.0",
]

# The application reads the issue page from the installed metadata
# (`app_metadata.APP_ISSUES_URL`) to link it from a failure's details, so the
# address is written only here (`PL-XWCH`).
[project.urls]
Repository = "https://github.com/stuthedew/open-anesthesia-sim"
Issues = "https://github.com/stuthedew/open-anesthesia-sim/issues"

[project.scripts]
anesthesia-sim = "anesthesia_sim.app.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Property-based tests draw values across and beyond every supported-range
    # guard rather than the edges one test's author thought of, the class
    # behind `PL-YZ17`, `PL-5F76` and `PL-BPRK` (`PL-V10T`, decided
    # 2026-10-03). Tests only, and derandomized there, so the suite stays
    # deterministic.
    "hypothesis>=6.168.3",
    # `docket.markdown` is the one block reader every Markdown reader in docket
    # and `tools/` takes, written by hand because those run on the standard
    # library alone; a test holds it to markdown-it-py's reading of every
    # tracked document, so a block rule it gets wrong fails here rather than
    # waiting for a sweep to find it (`PL-0C2S`). Tests only: nothing docket,
    # the tools or the hooks import reaches it.
    "markdown-it-py>=4.2.0",
    "mypy>=2.3.1",
    # pylint's duplicate-code check (R0801) alone, run by
    # `tools/duplicate_code_check.py` as a ratchet over `src/`, `tools/` and
    # docket, so copied logic fails `make check` (`PL-VWXL`). No other pylint
    # message is enabled; ruff is the linter.
    "pylint>=4.1.3",
    # 9.2.0 fixes a fixture lookup that failed when the paths on one command
    # line return to a directory after leaving it, as `tests/a/test_x.py
    # tests/test_y.py tests/a/test_z.py` does: `test_z.py` lost the fixtures of
    # `tests/a/conftest.py` (pytest issue 14635, in pytest's changelog for
    # 9.2.0, read 2026-11-27, `PL-NV1C`).
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    # Shuffles the test order, for `drift.yml`'s weekly `order` job only. The
    # `-p no:randomly` in `addopts` below keeps every other run in file order,
    # and the job turns it back on with `-p randomly` and a dated seed, so a
    # test that passes only after another one fails there with a seed that
    # reproduces it (`PL-75D9`).
    "pytest-randomly>=5.0.0",
    # A time limit on each test. Without one, a fault that makes a loop run
    # forever hangs the whole run until the CI job's own `timeout-minutes`, and
    # the log never names the test that stopped (`PL-FKVR`). `timeout` in
    # `[tool.pytest.ini_options]` below sets the limit, and its comment says
    # where the number comes from and what the limit does not interrupt.
    #
    # 2.4.0 is the newest release that installs, though PyPI lists 2.5.0: that
    # release is yanked, with the reason "accidental breaking change
    # (probably)" (read from <https://pypi.org/pypi/pytest-timeout/json> on
    # 2026-11-23). So this floor resolves to 2.4.0, and `uv lock --upgrade`
    # leaves it there until a later release appears.
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    # `docket.frontmatter` reads a rule's or skill's YAML front matter by hand,
    # because docket and the tools run on the standard library alone; a
    # derandomized Hypothesis corpus holds where it ends each top-level key to
    # PyYAML's reading, so a YAML form it misreads fails here rather than
    # waiting for a sweep to find it (`PL-R417`, `PL-YQ9G`). Tests only:
    # nothing docket, the tools or the hooks import reaches it.
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
    # PyYAML ships no types, so without its typeshed stubs the import above is
    # unresolved to `tools/type_ignore_check.py`, which then declines to judge any
    # `type: ignore` in the test trees (`PL-R417`).
    "types-pyyaml>=6.0.12.20260906",
]
# mutmut, for `make mutate` and nothing else, so `uv sync` leaves it out and no
# test or check depends on it (`PL-Y1PS`). Pinned exactly, because
# `tools/diff_mutation.py` builds mutmut's mutant names and reads the output of
# `mutmut results`, and a new release may change either. 3.8.1 reads a test's
# id through pytest's public `nodeid`. 3.8.0 read the private `_nodeid`, which
# pytest 9.2.0 no longer has, so every mutation run stopped at its first step
# (`PL-LR03`).
mutation = ["mutmut==3.8.0"]

# uv resolves `.python-version` against the interpreter list baked into the
# binary at build time, so an older uv silently maps a bare `3.14` onto the
# newest 3.14 it happens to know - which is how this project ran on
# 3.14.0rc2. The floor matches the build backend above, so one number
# describes the whole toolchain, and `astral-sh/setup-uv` reads it to choose
# the uv that CI installs.
[tool.uv]
required-version = ">=0.12.5"

[tool.pytest.ini_options]
testpaths = ["tests", "subprojects/docket/tests"]
# `-p no:randomly` keeps pytest-randomly from shuffling any run but the one
# that asks for it, which is `drift.yml`'s `order` job (`PL-75D9`). It sits
# here rather than on each command line, so a session's own `uv run pytest`
# keeps the file order too.
addopts = "-ra -p no:randomly"
# `tools/` holds repo tooling that is not part of the shipped package, and
# `subprojects/docket/` is a standalone package this repository also uses.
pythonpath = ["tools", ".claude/hooks", "subprojects/docket/src"]
# How long one test may run before pytest-timeout fails it. The limit sits here
# rather than on a command line, so a session's own `uv run pytest` carries it
# as well as `make check` and CI. CI's quality jobs keep their own
# `timeout-minutes`, which limits a whole job rather than one test.
#
# 300 seconds is about 2.4 times the slowest test measured on 2026-11-23, on
# this project's cloud container, on `main`, with `-n 4` and another full check
# running at the same time. The whole suite took 1,101 seconds, and the four
# slowest tests took 124.6, 86.1, 66.9 and 66.0 seconds. The slowest was
# `tests/unit/test_doc_check.py::test_this_repository_reports_its_own_resident_total`.
# NumPy passes `--timeout=600` to pytest in its Linux CI jobs and lists this
# plugin in its `test-core` dependency group
# (https://raw.githubusercontent.com/numpy/numpy/main/.github/workflows/linux.yml
# and NumPy's own `pyproject.toml`, both read 2026-11-23), so 300 is half what
# a much larger suite allows and still well clear of this one.
#
# `timeout_method` is left at the plugin's default, which on this platform is
# `signal`. The plugin schedules SIGALRM. When the alarm fires, its handler
# dumps the other threads' stacks and fails that one test, so the run finishes
# and every other result survives. The other method, `thread`, ends the whole
# process instead, which loses the results that process had already collected.
# The suite holds 13,057 tests, counted on 2026-11-23.
#
# The signal does not reach a test blocked inside Qt's own C++ event loop,
# because no Python bytecode runs there to take the signal. No test enters such
# a loop today. The Qt tests drive the interface with `QTest` mouse calls and
# `QApplication.processEvents`, and both return to Python.
#
# Code that sets its own SIGALRM replaces the plugin's handler and alarm, so it
# must put both back. `.claude/hooks/guard.py` sets one to stop a guard that
# runs past its own deadline, and puts the outer handler and the time left back
# when the guard returns. `tests/unit/test_guard.py` checks that it does.
#
# The mutation run takes this limit too, where its own limits do not stop a
# mutant first. `tools/diff_mutation.py` runs pytest inside `mutants/`, and
# pytest finds this file as its configuration from there. mutmut 3.8.0 gives
# each mutant a wall-clock limit of `(the estimated time of its tests + 1) * 15`
# seconds and twice that in processor time, so for a test of a second or two it
# stops the mutant long before 300 seconds. The limit here does reach the
# tool's own rerun of a mutant's whole test files, which allows the rerun 900
# seconds: a mutant that makes one test loop forever now fails that test after
# 300 seconds, and the tool reports it as killed rather than as a timeout.
# `CAUGHT` in `tools/diff_mutation.py` counts either answer as caught.
timeout = 300

# Mutation testing (`PL-Y1PS`). `make mutate` runs `tools/diff_mutation.py`,
# which mutates the functions the current branch changes, or every function
# with `--all`. `docs/mutation-testing.md` explains how to read a survivor and
# records the baseline.
[tool.mutmut]
source_paths = ["src/"]
# The rule: every module under `src/` is mutated unless it imports Qt, or is
# named below with its reason. No list of the mutated modules is kept, so a new
# module that imports no Qt is mutated with no edit here. A hand list of the
# mutated modules had left out all of `layout/` and 17 modules of `app/` that
# import no Qt (`PL-19M4`). mutmut reads only this table, so
# `do_not_mutate` has to name each module that imports `PySide6` or
# `pyqtgraph`. Those are widget code, whose tests are integration tests that
# mutmut does not run. `rule_disagreements` in `tools/diff_mutation.py` reads
# every module's imports, and `make mutate` and a unit test both fail when this
# list and the imports disagree.
do_not_mutate = [
    "src/anesthesia_sim/app/area_layout.py",
    "src/anesthesia_sim/app/main.py",
    "src/anesthesia_sim/app/pinned_heading.py",
    "src/anesthesia_sim/app/qt_agent_cost.py",
    "src/anesthesia_sim/app/qt_agent_price.py",
    "src/anesthesia_sim/app/qt_chart.py",
    "src/anesthesia_sim/app/qt_schematic.py",
    "src/anesthesia_sim/app/qt_widgets.py",
    "src/anesthesia_sim/app/run_surfaces.py",
    "src/anesthesia_sim/app/run_view.py",
    "src/anesthesia_sim/app/simulation_view.py",
    "src/anesthesia_sim/app/views.py",
    "src/anesthesia_sim/app/workspace_tabs.py",
    # Imports no Qt. `[tool.diff_mutation.left_out]` gives the reason.
    "src/anesthesia_sim/app/display_units.py",
]
# pytest reads its test files from `mutants/selected-tests.txt`, which
# `tools/diff_mutation.py` writes before each run: every test file under
# `tests/unit/` that imports the simulator. Each deselected test fails on
# mutmut's copy of the code with no mutant applied, and mutmut stops when one
# does. The first two list the functions in the modules of `core/`. Under
# mutmut the list also holds the mutant copies of those functions. The first
# test calls them to check its guards. The second finds their bare numbers,
# which its own list does not name (`PL-GP8G`). The third reads a layout from
# 150 frames short of the recursion limit. mutmut's wrapper adds two frames to
# every call of a mutated function, so the reader runs out of stack. The
# fourth lists what `app/stylesheets.py` imports, and mutmut's copy of that
# module also imports mutmut's wrapper (`PL-19M4`). The fifth lists the public
# names of `core/simulation_step.py`, and mutmut's copy of that module also
# defines mutmut's `MutantDict` (`PL-SZ6G`).
pytest_add_cli_args_test_selection = [
    "@selected-tests.txt",
    "--deselect",
    "tests/unit/test_supported_range_edges.py::test_each_guard_admits_only_what_its_functions_compute",
    "--deselect",
    "tests/unit/test_bare_numbers.py::test_every_bare_number_in_core_is_listed_with_its_reason",
    "--deselect",
    "tests/unit/test_layout_serialization.py::test_whether_a_document_reads_does_not_depend_on_where_its_caller_stands",
    "--deselect",
    "tests/unit/test_stylesheets.py::test_the_module_imports_nothing_but_the_theme_and_the_standard_library",
    "--deselect",
    "tests/unit/test_simulation_step.py::test_the_step_module_offers_no_other_step",
]
# The default, `fork`, imports each test module once, unmutated, and then forks
# a process for each mutant. A test whose expected value is computed when its
# module is imported then kills a mutant that the same real defect would pass.
# `forkserver` with no warm-up imports the test modules again for each mutant.
# The default warm-up, `collect`, would import them unmutated once more.
process_isolation = "forkserver"
forkserver_warmup = "none"
# The tests import `tools/doc_check.py` and `docket`, and read `docs/MODEL.md`
# and `README.md`. A test that reads a file not copied here fails when it is
# imported, and mutmut then stops before it runs any mutant (`PL-GP8G`).
# mutmut 3.8.0 fails to copy a file whose directory it has not created, so
# `docs/` is copied whole.
also_copy = ["tools/", "subprojects/docket/src/", "docs/", "README.md"]

# The reason for each module that mutmut leaves out though it imports no Qt, by
# its path. Each one is in `do_not_mutate` above too, and a module with no
# entry here is mutated.
[tool.diff_mutation.left_out]
"src/anesthesia_sim/app/display_units.py" = """\
mutmut 3.8.0 wraps `DisplayUnit.__init__`, and `Enum` calls it for each member \
while the class is still being built, before the wrapper's table of mutants \
exists. Every import of the module then raises `KeyError: '_mutmut_orig'`, so \
no test can run. The module holds that one function, with 3 mutants \
(measured 2026-11-11)."""

# The application's target, not the whole repository's. `tools/ruff.toml` and
# `subprojects/docket/ruff.toml` extend this file and override
# `target-version` to the bare-`python3` floor, because both trees are run by
# whatever `python3` is on PATH rather than by the project virtualenv, and a
# formatter aimed at 3.14 rewrites their source into syntax it cannot parse.
# Raising the number here does not reach them, and must not.
[tool.ruff]
target-version = "py315"
line-length = 100
[tool.ruff.format]
skip-magic-trailing-comma = true
# Ruff formats fenced Python blocks in Markdown files by default. An item brief
# under `docs/items/` quotes code but does not ship it, so the formatter
# leaves the store alone. CI's item-only fast path skips this check, and a
# brief out of ruff's format once merged green and turned `main` red
# (`PL-L9SF`). The glob names the files rather than the directory, because
# this setting is matched against each file's path: `"docs/items"` alone
# excluded nothing when measured with ruff 0.16.4.
exclude = ["docs/items/**"]

[tool.ruff.lint]
# `RUF100` is enabled on its own rather than through the whole `RUF` family:
# it is the rule that makes every other entry in this list mean what it says,
# by failing the build on a `noqa` that suppresses nothing. Without it a
# directive naming a rule this list does not select, or one whose finding has
# since been fixed, reads as a deliberate exemption while doing nothing.
#
# Measure it with `--extend-select RUF100`, never `--select RUF100`: the
# latter replaces this list, so every directive naming a rule other than
# RUF100 is reported "non-enabled" and a live suppression looks inert.
select = ["E", "F", "I", "UP", "B", "RUF100"]

# `I` puts the import sorter in the lint selection while `[tool.ruff.format]`
# sets `skip-magic-trailing-comma = true`, and ruff's defaults make those two
# disagree: isort would split an import on a magic trailing comma that the
# formatter then joins, so the pair has no fixpoint. Ruff warns about it on
# every `format` run, which is worse than the behaviour - a warning printed on
# every `make check` and `make fix` is one nobody reads, and it trains a
# session to skim the output where a real advisory also appears (`PL-V87X`).
#
# Resolved toward the formatter rather than away from it: the magic trailing
# comma is deliberately not honoured here, so the sorter is told the same
# thing. Setting `skip-magic-trailing-comma = false` instead would silence the
# warning by reversing a formatting decision nobody asked to revisit.
[tool.ruff.lint.isort]
split-on-trailing-comma = false
# The package's imports are named first-party rather than found. Left to
# isort's `match_sources`, an import is first-party only while its module's file
# exists under a `src` root - a fact about a *different* file - and ruff's cache
# keys a verdict to the linted file's mtime and permission bits alone, so
# deleting a module left a hand-typed `uv run ruff check .` replaying clean
# verdicts a cache-free run rejected. Isort reads this list before it probes, so
# the verdict no longer rests on the other file. The Makefile's `ruff check`
# line says why the gate keeps `--no-cache` anyway, and what this leaves to it
# (`PL-VZYS`).
known-first-party = ["anesthesia_sim"]

# The type-check gate, and the single source of truth for what it covers:
# `make check` and CI both run a bare `uv run mypy`, so widening it is one
# edit here rather than three. `subprojects/docket/src` is listed rather than
# reached through `mypy_path` because `tools/doc_check.py` imports
# `docket.roadmap` - both have to be in the same run for either to resolve.
#
# `tests/` is deliberately outside the gate. Measured 2026-08-31, with the
# three paths below clean: adding `tests` reports 39 errors in 7 files, 27 of
# them `[arg-type]` in `tests/unit/test_simulation_view.py`, where hand-built
# doubles stand in for Flet's `Page` and `Control`. Annotating a UI double to
# satisfy the framework's types is the most work in this repository for the
# least return, because a wrongly typed fake fails the test that uses it.
#
# `tests/` being outside the gate does not leave its `type: ignore` directives
# unread. `tools/type_ignore_check.py`, in `make check` directly below the gate,
# runs mypy over both test trees separately and reads two things out of the
# result: an inert directive, and an unresolved import - which would make live
# directives look inert and so invalidates the answer rather than adding to it.
# It is the `RUF100` guarantee above, for the other tool. `PL-J5NN` carries why
# that shape rather than widening this list.
#
# Most of the 12 errors outside that file are the gate arguing with a
# required practice rather than finding a defect: `test_alveolar.py` passes
# `"not a number"` to a `float` parameter, and `test_parameters.py` builds a
# model with `type()` so its `.model_validate` is invisible. Both are the
# invalid-input and pathological-input tests CLAUDE.md's safety standard asks
# for, and gating `tests/` would mean a suppression on each - which
# `docs/worker.md` forbids a delegated worker from writing. Revisit if errors
# appear there that are neither a UI double nor a deliberately wrong argument.
[tool.mypy]
python_version = "3.15"
files = ["src", "tools", ".claude/hooks", "subprojects/docket/src"]
strict = true

# pyqtgraph ships neither stubs nor `py.typed`, so under `strict` every plot
# item is `Any` to the checker. `app/qt_chart.py` keeps that surface small by
# holding its own typed state beside the items, and holds the geometry it
# hands them - which curve draws which compartment - in `app/chart_frame.py`,
# which imports no toolkit and is typed in full. PySide6 needs no entry: its
# wheels carry stubs.
[[tool.mypy.overrides]]
module = ["pyqtgraph", "pyqtgraph.*"]
ignore_missing_imports = true

# pytest-xdist ships neither stubs nor `py.typed` either. Only `tests/` imports
# it - `tests/conftest.py` names the worker its controller-side hook is handed,
# and `tests/unit/test_worksteal_dealing.py` drives its scheduler (`PL-4Z5Y`) -
# and `tools/type_ignore_check.py`'s pass over `tests/` refuses an unresolved import.
[[tool.mypy.overrides]]
module = ["xdist", "xdist.*"]
ignore_missing_imports = true
