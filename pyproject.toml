[project]
name = "anesthesia-sim"
version = "0.4.27"
# "volatile" here where `README.md` says "inhaled", deliberately rather than by
# drift: a package Summary describes the artifact, and this release models
# sevoflurane, isoflurane and desflurane only. README "What it does not
# simulate" records the split and why (`PL-XF89`).
description = "A deterministic simulator of volatile-anesthetic uptake and distribution, built for teaching. An educational tool, not a medical device: not for clinical prediction, dosing, or monitoring."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Stuart Feichtinger", email = "stuthedew@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"

# The package's machine-readable statement of maturity, audience and subject.
# Every string below is an exact row of <https://pypi.org/classifiers/>, read
# 2026-09-06.
#
# **Nothing in this toolchain enforces that**, which is why the strings are
# verified against the published list by hand rather than trusted to the build.
# Measured 2026-09-06: `uv build` 0.12.7 built both artifacts from a
# `Development Status :: 3 - Alpah` typo without a warning, so a misspelling
# here ships in `PKG-INFO` and surfaces only at a PyPI upload this project does
# not perform. `PL-4MHK` records why that is not a check: five strings that
# change about once a release train do not earn a vendored copy of a 900-row
# list, and re-verifying them on every `make check` would be a check that never
# changes a decision.
#
# `Development Status :: 3 - Alpha` rather than `2 - Pre-Alpha`: a case runs
# end to end today - v0.4.0 shipped the teachable case and v0.4.4 the exact
# propagator - which is past the row that means "not yet functional". It is
# not `4 - Beta` because the MVP is still ahead (`ROADMAP.md` row 5, v0.5.0)
# and there is no packaged build, so the interfaces are still moving.
#
# Three families are deliberately absent rather than overlooked:
#
# - **No `License ::` row.** `license` above is an SPDX expression, which is the
#   form PEP 639 asks for and which ships as `License-Expression` in metadata
#   2.4. A license classifier beside it is not refused - measured the same day,
#   `uv build` warns "License classifiers are ambiguous and deprecated per PEP
#   639" and builds anyway - so its absence is a decision, not something the
#   backend imposed.
# - **No `Programming Language :: Python ::` rows.** `requires-python` directly
#   above states the interpreter range, and installers read that rather than a
#   classifier. A second copy would drift silently, which is the failure mode
#   the comments through the rest of this file are written against.
# - **No `Intended Audience :: Science/Research`.** `README.md` names two
#   readers - educators and trainees, and contributors - and neither is a
#   researcher. Claiming a research audience would imply the model has been
#   validated for inference rather than for teaching, which is the kind of
#   over-claim `CLAUDE.md`'s presentation-correctness standard forbids.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    # One toolkit, which is what finishing the port meant. Both were declared
    # here for the length of it: PySide6 and pyqtgraph entered with `PL-G59B`,
    # the chart, and `flet` stayed until the last module importing it was gone
    # (`ROADMAP.md` § "v0.4.26 - the interface moves to Qt", Required scope
    # items 1, 2 and 5). `PL-25KS` deleted that module, so the two lines below
    # went out with `PL-3SQT` - the subtractive half, taken after the tree
    # stopped needing them rather than on the schedule the item guessed.
    #
    # Nothing here is what keeps Flet out. `tools/import_boundary_check.py`
    # permits `flet` and `flet_charts` in no module under `src/` at all, so a
    # module reaching for either fails the build whatever this list says; a
    # dependency removed from a manifest is only a download saved.
    #
    # `PySide6-Essentials` rather than `PySide6`: the Essentials wheel is the
    # Qt modules this interface draws with (Core, Gui, Widgets) and none of
    # the Addons (WebEngine, Multimedia, 3D), which are the bulk of the full
    # distribution's download and are imported by nothing here.
    "PySide6-Essentials>=6.9,<7.0",
    "pyqtgraph>=0.13.7,<0.15",
    # A floor, not an exact pin. pydantic 2.12.4 began passing
    # `prefer_fwd_module=` to `typing._eval_type`, a keyword CPython added
    # between 3.14.0rc2 and 3.14.0 final, so on the release candidate this
    # project used to run it raised `TypeError: _eval_type() got an
    # unexpected keyword argument 'prefer_fwd_module'` while evaluating the
    # deferred annotations in core/parameters.py (pydantic/pydantic#12501,
    # closed "not planned" upstream because the rc was never a supported
    # target). `.python-version` now names a final release, where 2.12.4 and
    # 2.13.5 both parse every shipped agent and patient file; the floor keeps
    # the broken pairing unreachable rather than pinning around it.
    "pydantic>=2.12.4,<3.0",
]

[project.scripts]
anesthesia-sim = "anesthesia_sim.app.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.4",
]

# uv resolves `.python-version` against the interpreter list baked into the
# binary at build time, so an older uv silently maps a bare `3.14` onto the
# newest 3.14 it happens to know - which is how this project ran on
# 3.14.0rc2. The floor matches the build backend above, so one number
# describes the whole toolchain, and `astral-sh/setup-uv` reads it to choose
# the uv that CI installs.
[tool.uv]
required-version = ">=0.12.5"

[tool.pytest.ini_options]
testpaths = ["tests", "subprojects/docket/tests"]
addopts = "-ra"
# `tools/` holds repo tooling that is not part of the shipped package, and
# `subprojects/docket/` is a standalone package this repository also uses.
pythonpath = ["tools", ".claude/hooks", "subprojects/docket/src"]
# The application's target, not the whole repository's. `tools/ruff.toml` and
# `subprojects/docket/ruff.toml` extend this file and override
# `target-version` to the bare-`python3` floor, because both trees are run by
# whatever `python3` is on PATH rather than by the project virtualenv, and a
# formatter aimed at 3.14 rewrites their source into syntax it cannot parse.
# Raising the number here does not reach them, and must not.
[tool.ruff]
target-version = "py314"
line-length = 100
[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
# `RUF100` is enabled on its own rather than through the whole `RUF` family:
# it is the rule that makes every other entry in this list mean what it says,
# by failing the build on a `noqa` that suppresses nothing. Without it a
# directive naming a rule this list does not select, or one whose finding has
# since been fixed, reads as a deliberate exemption while doing nothing.
#
# Measure it with `--extend-select RUF100`, never `--select RUF100`: the
# latter replaces this list, so every directive naming a rule other than
# RUF100 is reported "non-enabled" and a live suppression looks inert.
select = ["E", "F", "I", "UP", "B", "RUF100"]

# `I` puts the import sorter in the lint selection while `[tool.ruff.format]`
# sets `skip-magic-trailing-comma = true`, and ruff's defaults make those two
# disagree: isort would split an import on a magic trailing comma that the
# formatter then joins, so the pair has no fixpoint. Ruff warns about it on
# every `format` run, which is worse than the behaviour - a warning printed on
# every `make check` and `make fix` is one nobody reads, and it trains a
# session to skim the output where a real advisory also appears (`PL-V87X`).
#
# Resolved toward the formatter rather than away from it: the magic trailing
# comma is deliberately not honoured here, so the sorter is told the same
# thing. Setting `skip-magic-trailing-comma = false` instead would silence the
# warning by reversing a formatting decision nobody asked to revisit.
[tool.ruff.lint.isort]
split-on-trailing-comma = false

# The type-check gate, and the single source of truth for what it covers:
# `make check` and CI both run a bare `uv run mypy`, so widening it is one
# edit here rather than three. `subprojects/docket/src` is listed rather than
# reached through `mypy_path` because `tools/doc_check.py` imports
# `docket.roadmap` - both have to be in the same run for either to resolve.
#
# `tests/` is deliberately outside the gate. Measured 2026-08-31, with the
# three paths below clean: adding `tests` reports 39 errors in 7 files, 27 of
# them `[arg-type]` in `tests/unit/test_simulation_view.py`, where hand-built
# doubles stand in for Flet's `Page` and `Control`. Annotating a UI double to
# satisfy the framework's types is the most work in this repository for the
# least return, because a wrongly typed fake fails the test that uses it.
#
# `tests/` being outside the gate does not leave its `type: ignore` directives
# unread. `tools/ignore_check.py`, in `make check` directly below the gate,
# runs mypy over both test trees separately and reads two things out of the
# result: an inert directive, and an unresolved import - which would make live
# directives look inert and so invalidates the answer rather than adding to it.
# It is the `RUF100` guarantee above, for the other tool. `PL-J5NN` carries why
# that shape rather than widening this list.
#
# Most of the 12 errors outside that file are the gate arguing with a
# required practice rather than finding a defect: `test_alveolar.py` passes
# `"not a number"` to a `float` parameter, and `test_parameters.py` builds a
# model with `type()` so its `.model_validate` is invisible. Both are the
# invalid-input and pathological-input tests CLAUDE.md's safety standard asks
# for, and gating `tests/` would mean a suppression on each - which
# `docs/worker.md` forbids a delegated worker from writing. Revisit if errors
# appear there that are neither a UI double nor a deliberately wrong argument.
[tool.mypy]
python_version = "3.14"
files = ["src", "tools", ".claude/hooks", "subprojects/docket/src"]
strict = true

# pyqtgraph ships neither stubs nor `py.typed`, so under `strict` every plot
# item is `Any` to the checker. `app/qt_chart.py` keeps that surface small by
# holding its own typed state beside the items, and holds the geometry it
# hands them - which curve draws which compartment - in `app/chart_frame.py`,
# which imports no toolkit and is typed in full. PySide6 needs no entry: its
# wheels carry stubs.
[[tool.mypy.overrides]]
module = ["pyqtgraph", "pyqtgraph.*"]
ignore_missing_imports = true
