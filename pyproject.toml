[project]
name = "anesthesia-sim"
version = "0.2.2"
description = "Open-source anesthesia simulation project"
readme = "README.md"
authors = [
    { name = "Stuart Feichtinger", email = "stuthedew@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "flet-charts>=0.86,<1.0",
    "flet[all]>=0.86,<1.0",
    # Exact pin, not a floor: pydantic>=2.12.4 crashes on this project's
    # pinned Python 3.14.0rc2 build (TypeError in typing._eval_type via
    # pydantic's compat shim; see pydantic/pydantic#12501, closed "not
    # planned" upstream). Do not relax this without re-testing against
    # whatever Python 3.14 build is in use at the time.
    "pydantic==2.12.0",
]

[project.scripts]
anesthesia-sim = "anesthesia_sim.app.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests", "subprojects/docket/tests"]
addopts = "-ra"
# `tools/` holds repo tooling that is not part of the shipped package, and
# `subprojects/docket/` is a standalone package this repository also uses.
pythonpath = ["tools", "subprojects/docket/src"]
[tool.ruff]
target-version = "py314"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.14"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["flet_charts", "flet_charts.*"]
ignore_missing_imports = true
