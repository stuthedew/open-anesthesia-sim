[project]
name = "anesthesia-sim"
version = "0.2.7"
description = "Open-source anesthesia simulation project"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Stuart Feichtinger", email = "stuthedew@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "flet-charts>=0.86,<1.0",
    "flet[all]>=0.86,<1.0",
    # A floor, not an exact pin. pydantic 2.12.4 began passing
    # `prefer_fwd_module=` to `typing._eval_type`, a keyword CPython added
    # between 3.14.0rc2 and 3.14.0 final, so on the release candidate this
    # project used to run it raised `TypeError: _eval_type() got an
    # unexpected keyword argument 'prefer_fwd_module'` while evaluating the
    # deferred annotations in core/parameters.py (pydantic/pydantic#12501,
    # closed "not planned" upstream because the rc was never a supported
    # target). `.python-version` now names a final release, where 2.12.4 and
    # 2.13.5 both parse every shipped agent and patient file; the floor keeps
    # the broken pairing unreachable rather than pinning around it.
    "pydantic>=2.12.4,<3.0",
]

[project.scripts]
anesthesia-sim = "anesthesia_sim.app.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

# uv resolves `.python-version` against the interpreter list baked into the
# binary at build time, so an older uv silently maps a bare `3.14` onto the
# newest 3.14 it happens to know - which is how this project ran on
# 3.14.0rc2. The floor matches the build backend above, so one number
# describes the whole toolchain, and `astral-sh/setup-uv` reads it to choose
# the uv that CI installs.
[tool.uv]
required-version = ">=0.12.5"

[tool.pytest.ini_options]
testpaths = ["tests", "subprojects/docket/tests"]
addopts = "-ra"
# `tools/` holds repo tooling that is not part of the shipped package, and
# `subprojects/docket/` is a standalone package this repository also uses.
pythonpath = ["tools", "subprojects/docket/src"]
[tool.ruff]
target-version = "py314"
line-length = 100
[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.14"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["flet_charts", "flet_charts.*"]
ignore_missing_imports = true
