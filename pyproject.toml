[project]
name = "anesthesia-sim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Stuart Feichtinger", email = "stuthedew@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flet>=0.86,<1.0",
]

[project.scripts]
anesthesia-sim = "anesthesia_sim:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]
