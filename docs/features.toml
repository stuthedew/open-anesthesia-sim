# Every feature name an item in docs/items/ carries, with one line saying what
# belongs in it. `bin/docket status` and `bin/docket feature` print the line
# beside the name, and `bin/docket check` refuses an item whose `feature:` is
# not listed here, and a line here that no item carries.
#
# A new feature is a new line here, in the commit that files its first item.
# Name it for what completes, so `bin/docket feature NAME` can say when it is
# finished, and describe what work belongs in it in one plain sentence.
# Closed features stay listed, because their items keep the name (PL-Q3BN).

