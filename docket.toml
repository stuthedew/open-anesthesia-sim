# docket settings for this repository. Every value here is also the package
# default; they are written out so that the policy is visible at the project
# root rather than only in the tool, and so that changing one is an edit to
# this repository rather than to a subproject shared with others.
[docket]
items_dir = "docs/items"

# Subject matter that may not sit in the lower bands however small the task
# looks, per CLAUDE.md's safety-critical standard.
safety_classes = ["safety", "science"]

# Work on how the project is built rather than on the product it builds.
process_classes = ["session-cost", "docs", "infra"]

# ROADMAP.md, "The debt gate" - "What counts": an open item is debt when it
# carries one of these classes, or when its status is needs-decision. `feature`
# and `planning` work is not debt; counting it would make the rule say "do
# everything before doing anything", which no gate can open. `bin/docket gate`
# reads this.
debt_classes = ["defect", "safety", "science", "refactor", "perf"]

# Past this, the top band stops answering "what next?" at a glance.
top_band_limit = 5

# Past this, an untriaged capture has become a second queue nobody reads.
untriaged_stale_days = 14

# The date this project adopted the rule that a `ready` item names the command
# that proves it done (PL-G049). Items captured on or after it must carry
# `verify:`, or record in `not-delegable:` why no command can prove them; the
# 47 captured before it are reported as one grooming advisory instead of 47
# errors, so the rule starts working immediately without making `docket check`
# useless on the day it lands. Moving this date earlier is how the backlog is
# closed out - it is a burn-down, not a permanent exemption.
verify_required_from = 2026-08-30

# Classes that make a release a minor version bump rather than a patch.
minor_classes = ["feature"]

version_file = "pyproject.toml"

# ROADMAP.md: "The next release number is chosen for the capability boundary it
# crosses, not by mechanically incrementing the patch number." So the version is
# named by a person; the tool refuses to invent one.
version_policy = "manual"

# Paths a delegated item may never modify, whatever its check proves. These are
# the files that produce clinically meaningful output: the scientific core, the
# validated parameter data, and the model specification. A delegated item may
# add tests *about* them and may never edit them, so no change to a displayed
# value can land on a diff nobody read.
#
# The partition is absolute rather than overridable by a strong enough check.
# "Allowed if the check is good enough" means relitigating the question per
# item, and the items where it would be relitigated are the ones that compute
# drug concentrations. Deleting a dead method in `core/` is excluded by this
# even where the check would be sound; that cost is accepted deliberately.
#
# Leaving this empty disables delegation entirely rather than permitting it
# everywhere. See `Item.delegability`.
protected_paths = [
  "src/anesthesia_sim/core",
  "src/anesthesia_sim/data",
  "docs/MODEL.md",
]
