# How `bin/docket flight` asks which branches have a pull request open, which
# is the half of "is anybody still on this branch" that git cannot answer
# (`PL-Q664`). A branch whose every item is closed *and* which nobody has
# opened a pull request for is finished work that has stalled; either fact
# alone is ordinary.
#
# Not a package default - it is empty there, and nothing in
# `subprojects/docket/` knows GitHub exists. That is the same boundary
# `.claude/hooks/docket-digest.sh` keeps for `tools/main_ci_status.py`: the
# package answers from a bare checkout with no network, so the forge-specific
# half lives in this repository's own `tools/` and the setting points at it.
#
# The script exits non-zero and prints nothing when it could not look, which is
# what lets `flight` say "every item closed" alone rather than claiming nothing
# is open, and print a row without its pull-request clause rather than "none
# open". `flight --no-remote` skips it outright.
open_pull_requests_command = "python3 tools/open_pull_requests.py"

version_file = "pyproject.toml"

# ROADMAP.md: "The next release number is chosen for the capability boundary it
# crosses, not by mechanically incrementing the patch number." So the version is
# named by a person; the tool refuses to invent one.
version_policy = "manual"

# Paths holding the checks themselves. A delegated diff that edits one has
# changed the thing measuring it, so the measurement means nothing - and
# `docs/worker.md`'s "Never edit the checks themselves" now cites this list
# rather than restating it, which is the whole point of writing it out here.
#
# Read at both ends, which is what `PL-S2L4` fixed. `docket verify`'s "the
# checks themselves are unedited" audit has always read it; `Item.delegability`
# now reads it too, so `bin/docket delegable` stops offering work that audit
# would REJECT once a worker had finished it. Fifteen of the eighty-six items
# it offered on 2026-09-08 were that shape.
#
# The first five are the package defaults, repeated per this file's opening
# convention. The two `ruff.toml` entries are this repository's addition:
# they are how `tools/` and `subprojects/docket/` stay parseable by the bare
# `python3` that runs them, so relaxing one to clear a format failure breaks
# the thing the check exists to protect. `.claude/hooks/ruff.toml` needs no
# entry - the `.claude` prefix already covers it.
#
# Naming those two by hand is the weakness here, and it is the same shape
# that made `workflow_paths` drift nine entries short (`PL-JBZK`): a new
# `ruff.toml` under `tools/` or a new subproject is silent, and silent in the
# direction that hurts. `PL-BBDD` carries the check that would decide it from
# the tree, as `tools/workflow_paths_check.py` already does for the list
# above.
gate_paths = [
  "Makefile",
  "pyproject.toml",
  ".github",
  ".claude",
  "docket.toml",
  "subprojects/docket/ruff.toml",
  "tools/ruff.toml",
]

# Paths a delegated item may never modify, whatever its check proves. These are
# the files that produce clinically meaningful output: the scientific core, the
# validated parameter data, and the model specification. A delegated item may
# add tests *about* them and may never edit them, so no change to a displayed
# value can land on a diff nobody read.
#
# The partition is absolute rather than overridable by a strong enough check.
# "Allowed if the check is good enough" means relitigating the question per
# item, and the items where it would be relitigated are the ones that compute
# drug concentrations. Deleting a dead method in `core/` is excluded by this
# even where the check would be sound; that cost is accepted deliberately.
#
# Leaving this empty disables delegation entirely rather than permitting it
# everywhere. See `Item.delegability`.
protected_paths = [
  "src/anesthesia_sim/core",
  "src/anesthesia_sim/data",
  "docs/MODEL.md",
]

# Paths holding the machinery that identifies and ranks *generators*. An item
# declaring `impairs-generators:` claims to be a defect in that machinery,
# which puts it on the generator tier - above every band but `P0`, the same
# priority a generator itself ranks at (project owner, 2026-09-19). This list
# is what refutes such a claim when the item's `touches` reaches none of it.
#
# It can only refute, and the number is why. Measured against this store on
# 2026-09-19, 36 of 322 open items declare one of these files for reasons
# having nothing to do with generators. Promoting on the path alone would
# promote all 36, which is the objection `tools/generator_check.py` already
# records against citation density at 33 - "promoting all of them would mean
# nothing". The machinery is a few functions inside files that do many other
# things, so the claim stays the declaring session's judgment and this is the
# cheap falsifier: it rejects a claim on an item that never goes near the
# code, which is 286 of the 322.
#
# Code and the candidate-surfacing tool only. The prose that *states* the rule
# - CLAUDE.md, the `docket` skill, this subproject's README - is deliberately
# absent: those three are declared by 7, 12 and 3 open items respectively, and
# admitting them would leave the falsifier refusing almost nothing. A defect
# that is genuinely only in the rule's wording therefore errors here until
# this list is widened, which is the right direction for a fail-closed setting
# - a visible edit with a reason, rather than a silent promotion.
generator_paths = [
  "subprojects/docket/src/docket/plan.py",
  "subprojects/docket/src/docket/model.py",
  "subprojects/docket/src/docket/checks.py",
  "subprojects/docket/src/docket/render.py",
  "subprojects/docket/src/docket/cli.py",
  "subprojects/docket/src/docket/config.py",
  "tools/generator_check.py",
  "tests/unit/test_generator_check.py",
]

# Past this, a dated assertion in an instruction file is due for re-checking.
#
# **90 rather than 180, and the number is the load-bearing decision** (project
# owner, 2026-09-21, ratified, over 180). The threshold decides whether the
# advisory is ever tested before it matters, not just how much it reports. The
# oldest dated assertion in this repository's instruction set was 21 days old
# when this was set, so at 180 days the advisory names nothing for about 159
# days and then fires for the first time, untested, against assertions nobody
# remembers writing, in a session with no idea what it is for. At 90 it first
# fires on 2026-11-30 - about ten weeks out - while the assertions are recent
# enough for the project owner to judge the output quickly, and that first
# firing is the validation run.
#
# Raise it once the advisory has been seen to name the right things. Raising it
# *before* that is silencing an untested mechanism, which is the one move the
# number was chosen to prevent.
instruction_stale_days = 90

# The instruction files that audit reads. Not a package default - it is empty
# there, and nothing in `subprojects/docket/` knows this repository's layout.
#
# What is here is everything a session is instructed by: `CLAUDE.md` and the
# rules that load with it, the `docket` skill and its modes, and the worker
# instructions. Measured 2026-09-21: 74 date occurrences on 71 lines across 17
# of the 22 markdown files these four entries reach.
#
# `docs/maintainer.md` is deliberately absent, and it is the one judgment in
# this list. It carries 12 dated assertions and is addressed to the *person*
# running the sessions rather than to a session - so an assertion in it that
# has gone wrong misleads somebody who can see the tree, while the same
# sentence in `CLAUDE.md` is obeyed by a session that cannot. Add it if that
# stops being the right split; nothing here depends on its absence.
#
# `ROADMAP.md`, `docs/MODEL.md` and the item store are absent for a different
# reason: they are records of what was decided and measured, not instructions
# a session follows, and their dates are the record rather than a claim that
# has to stay true.
instruction_paths = [
  "CLAUDE.md",
  ".claude/rules",
  ".claude/skills",
  "docs/worker.md",
]
