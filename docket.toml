# docket settings for this repository. Every value here is also the package
# default; they are written out so that the policy is visible at the project
# root rather than only in the tool, and so that changing one is an edit to
# this repository rather than to a subproject shared with others.
[docket]
items_dir = "docs/items"

# The running cross-session log beside the queue. `docket show` splits it at its
# `##` headings and names the threads concerning the item being shown, which is
# what makes the file reachable at all: its own instruction to read it "at the
# start of a task that touches one of its open threads" cannot be evaluated
# without reading it (`PL-7QKY`).
#
# Not a package default - it is empty there, and nothing in `subprojects/docket/`
# knows this path. A notes file is this repository's convention rather than the
# tool's.
notes_file = "docs/WORKING_NOTES.md"

# Subject matter that may not sit in the lower bands however small the task
# looks, per CLAUDE.md's safety-critical standard.
safety_classes = ["safety", "science"]

# Work on how the project is built rather than on the product it builds.
#
# `housekeeping` is here as well as in `known_classes` because the top-band
# rule reads this list: an item counts as process work only when *every* one of
# its classes is in it, so a `housekeeping`-only item left out of this list
# would be eligible for the top band, which is the opposite of what the class
# means.
process_classes = ["session-cost", "docs", "infra", "housekeeping"]

# ROADMAP.md, "The debt gate" - "What counts": an open item is debt when it
# carries one of these classes, or when its status is needs-decision. `feature`
# and `planning` work is not debt; counting it would make the rule say "do
# everything before doing anything", which no gate can open. `bin/docket gate`
# reads this.
debt_classes = ["defect", "safety", "science", "refactor", "perf"]

# What `bin/docket next --oldest` leaves out as new work rather than work owed
# (`PL-Q89J`): the line "What counts" draws, where an item classed `feature` or
# `planning` "is **not** debt". Everything else startable is owed, which reaches
# the `docs`, `infra`, `test` and `ux` items no gate will hold - the half of the
# owed work at risk of being forgotten. A debt class or `needs-decision` keeps
# an item owed whatever else it carries, so the gate and `--oldest` cannot
# disagree about one item.
new_work_classes = ["feature", "planning"]

# Past this, the top band stops answering "what next?" at a glance.
#
# Raised from the package default of 5 on 2026-08-30, deliberately and not as
# a way of silencing the advisory. `checks.py` refuses to seat a `safety`- or
# `science`-classed item below P1, and every P1 item this project has ever held
# carries one of those classes. So the band's size here is a measure of how
# much safety work is open, which is what the debt gate already tracks - not a
# measure of anyone having over-prioritized, which is what the advisory was
# built to catch. At 5 it fired continuously and meant nothing.
#
# 12 rather than 10: nine are open today and four of them arrived in a single
# session, so a limit set one above the current count would fire again within
# days and teach the same lesson - that the advisory is noise. Twelve leaves
# real headroom while still meaning something if it is reached.
#
# Do not "tidy" this back to the default. Exempting safety-classed items from
# the count was considered and rejected: it would silence the advisory
# permanently here, and a band that grows to twenty safety items is a genuine
# problem a session should be told about.
top_band_limit = 12

# Past this, an untriaged capture has become a second queue nobody reads.
untriaged_stale_days = 14

# The date this project adopted the rule that a `ready` item names the command
# that proves it done (PL-G049). Items captured on or after it must carry
# `verify:`, or record in `not-delegable:` why no command can prove them, so
# the rule started working immediately without making `docket check` useless
# on the day it landed.
#
# The items captured before it are a closed set - nothing can be added to it,
# since the test is the capture date - and it burns down as work is picked up
# rather than in a campaign (PL-5YK8). `checks.py` raises the advisory only
# for the ones `docket next` is about to offer, and carries the remaining
# total inside the message, so it names work a session can do in the session
# that sees it and reaches zero on a normal day. Backfilling the rest was
# rejected: a command written for an item nobody has started cannot be run
# before it is written, and every command in this store that was written that
# way was wrong.
#
# Moving this date earlier remains available and would make the whole set an
# error at once. Do not, without first giving each item a command that has
# actually been run.
verify_required_from = 2026-08-30

# The same requirement at the other end of an item's life, and the half that
# actually drains the set above (PL-J49T). An item closed on or after this date
# must name a command or a `not-delegable` reason, as an **error**.
#
# Keyed on the closure date rather than the capture date, which is what lets it
# reach the grandfathered items at all: they are exempt at `ready` and stay
# exempt however long they sit there, so until now the only thing asking for
# their command was a grooming advisory - a signal that works if somebody reads
# it, and on 2026-09-03 a session read "1 advisory" across several runs without
# reading the advisory. Closing an item is the first moment its command can be
# written having been run, which is the objection that earned the
# grandfathering; at that moment the objection has lapsed, so the exemption
# lapses with it.
#
# An error rather than an advisory because the decidable half and the judgment
# half separate cleanly here: whether the field is present is a yes/no, and only
# what it should say needs a person. This refuses silence without guessing at
# the sentence.
#
# Set to the day the rule landed, so it touches nothing already closed. The 54
# done items carrying no command stay as they are, deliberately: backfilling one
# onto merged work means writing a command with nothing left to run it against,
# which is precisely the failure PL-5YK8 refused at the other end.
verify_required_at_close_from = 2026-09-03

# What the command may *be*, once it is present - the third of the three dates,
# and the decidable half of the contract `PL-6TP8` settled on 2026-09-19
# (project owner, ratified): the field records the discriminator, and proving
# the tree is `check_command`'s job, which `docket verify`, `docs/worker.md`
# and CI each already run. Until now that contract was carried by one table in
# the `docket` skill - now `.claude/skills/docket/modes/triage.md` - and by
# nothing a machine reads, against a
# store recording 82 counter-examples - 23 of them written on 2026-09-14 alone.
#
# The rule fires only where the author has already said which clause
# discriminates, by writing a separate non-pytest one beside the run. A command
# whose only clause is the pytest run says the opposite and is untouched, as is
# one whose run carries `-k`, `-m`, `--cov` or a `::`. The other 73 multi-clause
# commands - `python3 tools/doc_check.py check && ...` and friends - are the
# same contract and are deliberately not refused here: which clause is the
# prerequisite there depends on what the item's work is, and scripting that
# judgment is worse than leaving it prose (`PL-09G9`).
#
# Dated tomorrow rather than today, which is the one thing here that is a
# choice rather than a reading. `PL-QSGX` was captured on 2026-09-19 carrying
# the shape; repairing another item's command outside the moment that item is
# started is the one-pass pass the project owner refused on the same day, so it
# is left to repair-as-started like the other 81 and the cutover starts after
# it. The grandfathered set is therefore exactly what the store held when the
# rule began working - closed, since the test is the capture date, and draining
# at the 48 items/day the queue closed over the fortnight to 2026-09-19.
verify_prerequisite_refused_from = 2026-09-20

# The test trees `check_command` already collects, mirroring
# `[tool.pytest.ini_options] testpaths` in `pyproject.toml`. Only a pytest
# target inside one of these is provably redundant with `make check`; a run
# over anything else is doing something no other consumer does, and the rule
# above leaves it alone. Measured 2026-09-19: 0 of the 82 name a target outside
# these two, which is the count that says the rule refuses nothing real.
#
# Kept here rather than read out of `pyproject.toml` because `bin/docket` runs
# from a bare checkout with no virtualenv and knows nothing about pytest's
# configuration. Drift is one-directional and safe: a tree added to `testpaths`
# and not here makes the rule refuse *less*, never more.
collected_test_paths = ["tests", "subprojects/docket/tests"]

# The first obligation `PL-6TP8` put on a command, made mechanical (`PL-Q8RQ`):
# its failure before the work is an evaluation - an ordinary exit 1 - and never
# pytest's 5. A pytest run narrowed by `-k` over a tree `collected_test_paths`
# names cannot be one. Every test there passes or `make check` is red, so the
# run selects tests that already pass (0) or selects none (5), and a substring
# is satisfied by whatever test later comes to carry it: `PL-S5YM`'s
# `-k covered` began passing when an unrelated merge added a test so named, and
# three sessions diagnosed the red `main` that followed inside four minutes
# (`PL-99YZ`). Refused wherever the clause stands in the `&&` chain; a run piped
# into another command, one carrying `--cov`, and one over a tree outside the
# list above are left alone, because there the reading stops being true.
#
# A date of its own rather than `verify_prerequisite_refused_from`'s, because the
# two close different sets. That rule leaves any run carrying `-k` alone, so
# `PL-W4XQ` was captured on its first day with one ahead of a `grep`, and
# sharing its date would refuse that item the moment this landed. Dated
# tomorrow, as both rules before it were, so the grandfathered set is exactly
# what the store held when the rule began working - five open items, `PL-10MX`,
# `PL-GVC0`, `PL-8JY7` and `PL-W4XQ` at `ready` and `PL-LWMS` at `blocked` -
# each repaired as its item is started, never in a pass.
verify_k_selector_refused_from = 2026-09-23

# What the command may be, stated as a list rather than a growing set of
# refusals (`PL-1P5V`; project owner, 2026-09-23, ratified, over a structured
# `verify:` field). The three dates above each refuse one shape, and each was
# written after its shape had failed: seven more arrived in the four days after
# `PL-6TP8` closed. From this date a command is one of the shapes the triage
# table prescribes - a `grep -q` for what the work adds, a `! grep -q` for what
# it removes, several of those joined by `&&`, or `uv run pytest
# --cov=<dotted.module> --cov-fail-under=<N>` alone - or the item says in
# `not-delegable:` why none can prove it. A new shape joins the list in
# `checks.py`, with its argument beside it, instead of failing first.
#
# Read two ways, because the capture date cannot say when a command was written.
# An item captured on or after this date is held to the list wherever it is
# checked. An older item's command is held to it on the branch that writes or
# rewrites it - `docket check` reads that from git, `docket set` knows it as it
# writes - so the triage of old items and the repair of legacy commands as each
# is started land in the list too; a command a branch leaves as the base had it
# stays grandfathered. Measured 2026-09-23 over the 220 open commands: 103 fit
# as they stand, 93 more once their legacy trailing health clause is stripped,
# and 24 are other shapes - tool runs, pipes, `-k`, `test -f`.
#
# Dated tomorrow, as the three before it were, so no item captured today is
# bound by its capture date. A branch is judged when it is checked, so one
# carrying an older item's new command has until the date to land it.
verify_allowlist_from = 2026-09-24

# The date an item reaching `ready` must carry one plain-language line of what
# closing it buys (`PL-WYKF`). The project owner asked for the half of "why this
# item" that `PL-MN0F` and `PL-Z27P` do not answer: those two print the band and
# the item's relation to the debt gate, both facts in the store, and neither says
# what the work is *for* - "I don't know why it's selected ... 'links predicate
# xyz predicate to runner 267' or whatever" (2026-09-19).
#
# A field rather than a rule for sessions to follow, because the sentence would
# otherwise be rebuilt from the brief at full context in every session that
# offers the item, which is what "prefer deterministic tooling over repeated
# model work" exists to stop. `checks.py` holds it to presence alone: whether the
# line states a consequence or restates the title is judgment, and a checker
# guessing at it would be authoritative and wrong.
#
# Scoped to every item rather than to the workflow lane, which was the session's
# own recommendation until it counted what the wider rule would cost (project
# owner, 2026-09-19). Measured that day: (a) every item charges 267 startable
# open items a sentence and leaves 0 undefined; (b) workflow-lane-only charges
# 157, leaves **31** items in neither lane with no rule at all - crossing or
# declaring no `touches`, and disproportionately the large cross-cutting work
# where the sentence is worth most - and is *more* code, being "every item from
# date D" plus a condition on a computed lane. The marginal cost is about 110
# sentences across the open backlog, each written by a session that already has
# the brief open because it is about to work the item.
#
# Dated tomorrow rather than today, the one choice here rather than a reading,
# exactly as `verify_prerequisite_refused_from` was: the grandfathered set is
# then closed at precisely what the store held when the rule began working, and
# no item captured today has to carry a line written away from its work. Nothing
# already closed is backfilled - that means writing a sentence about work whose
# context is gone, which is the failure `PL-5YK8` refused at the other end of
# `verify:`.
#
# The precedent says the burn-down works without a campaign. `verify:` is the
# same shape - required at `ready` from a cutover date, advisory only for the
# items `bin/docket next` is about to offer - and reached 913 of 1,278 items with
# 12 of 218 open `ready` items still lacking one, on no pass dedicated to it.
#
# Moving this date earlier makes the whole grandfathered set an error at once.
# Do not, without first giving each of those items a line.
payoff_required_from = 2026-09-20

# The date from which an item at `needs-decision` must *mark* a recommendation
# in its brief - give one, or say in so many words that none is being made and
# why.
#
# The question survives in the item. The recommendation that would let the
# owner answer it in one read survives only in the reply that posed it, and a
# reply dies with its session - so the longer an item waits, the likelier the
# recommendation is gone when the answer arrives. That is backwards, because
# waiting is what the status is for. `PL-KQHN` is the instance: its answer was
# reconstructed from a harness-written summary line naming two options and
# marking neither, and a decision about the release train rested on a reading
# of another model's compressed prose.
#
# Counted before it was built, per `.claude/rules/expert-review.md`: of the 45
# open `needs-decision` items on 2026-09-20, 8 marked a recommendation and 37
# did not. Two of the 37 use the word only to talk *about* recommending, which
# is why the test is the marker rather than the word.
#
# Dated the day after it was set, so the set it grandfathers is closed at what
# the store held when the rule began working. Advisory on both sides and never
# an error: a brief may honestly decline to recommend, and a check that
# refuses correct content is one `CLAUDE.md` retires.
recommendation_required_from = 2026-09-21

# Classes that make a release a minor version bump rather than a patch.
minor_classes = ["feature"]

# Every class an item may carry. `checks.py` rejects anything outside this
# list, because `classes` fails open everywhere it is read: each use is a
# membership test, so a misspelling matches no rule and nothing says so. The
# expensive instance is the safety pin - `classes: safey` is not in
# `safety_classes`, so work a clinician could be misled by stays seatable in
# the bottom band and `docket check` reports zero errors (`PL-MVC2`).
#
# Declared rather than derived because this store uses four classes the tool
# does not itself branch on. `ux`, `test` and `planning` describe work for a
# reader; `anticipated` is the exception, branched on by the safety pin to let
# a concern whose feature does not exist yet wait at its blocker's band.
#
# `housekeeping` is a fifth and is branched on: `checks.py` reads it to excuse
# an item whose work *is* the queue edit from the two brief sections that argue
# for the work rather than describe it, and refuses it beside any
# `debt_classes` entry so it cannot become the way to file a defect without a
# brief. Added 2026-09-19 on `PL-TQFB` (project owner, ratified), after 22
# triage-pass items were measured carrying 1,127 lines of brief of which 2 held
# a finding.
# Declaring the list at all replaces the derived default entirely, so every
# class the tool reads has to be repeated here - that is deliberate, since a
# vocabulary half-declared elsewhere is how the drift starts.
#
# Adding a class is an edit here first. That is the friction the check is for:
# `bug` reached the store once against `defect` ninety-two times, and split
# nothing only because it landed on an item that had already closed.
known_classes = [
  "anticipated",
  "defect",
  "docs",
  "feature",
  "housekeeping",
  "infra",
  "perf",
  "planning",
  "refactor",
  "safety",
  "science",
  "session-cost",
  "test",
  "ux",
]

# The boundary CLAUDE.md's "two standards, deliberately unequal" already draws,
# written down so `docket next workflow` and `docket next product` can act on
# it. An item's `touches` decides its side: all inside means workflow, none
# inside means product, and a mix is set aside for a session that can hold the
# whole change. Two simultaneous sessions then never rank onto the same item.
#
# Decided from `touches` rather than from `classes`. Measured against this
# store on 2026-09-04, the `classes` reading - "process work is an item whose
# classes are all in `process_classes`" - put 33 of 145 open items on the wrong
# side, because `classes` says what *kind* of work an item is and a defect in
# this repository's tooling carries the same `defect` label as a defect in the
# simulator. Eighteen workflow defects would have been offered to a simulator
# session. `touches` is declared on 142 of those 145 and is already what the
# conflict graph and the delegation guard read.
#
# Two groups of entries are here for reasons the directory names do not carry:
#
# - The `tests/unit/test_*.py` entries test `tools/` scripts and `.claude/`
#   hooks, and only live in the simulator's test tree because that is where
#   pytest is configured to look. Without them, an item that is plainly one
#   script and its own test crosses the boundary and is offered to neither
#   lane.
# - `Makefile` and `.github` are the same apparatus `gate_paths` names, and are
#   listed again rather than derived from it: `gate_paths` answers "may a
#   delegated diff touch this", which is a different question that could
#   reasonably change without this one changing with it.
#
# **Do not maintain the test-file entries by hand; they drifted when they were
# (`PL-JBZK`).** The list was written with three of them and was nine short a
# day later - `tools/` grows, every new script brings its own test, and the
# omission is silent in exactly the direction that hurts: `docket next
# workflow` and `docket next product` both set the item aside and neither says
# so. `tools/workflow_paths_check.py` now decides membership from the file
# itself, on the rule that a test under `tests/` is apparatus when it does not
# import `anesthesia_sim`, and `make check` fails until this list agrees. So
# the answer to "a new tools test landed" is to run the check and paste the
# line it prints, not to remember this paragraph.
#
# Deliberately absent, and each is a judgment rather than an oversight:
#
# - `ROADMAP.md` and `docs/releases/` are product direction. They name
#   simulator milestones and what shipped in them, so a session scoping the
#   next release is doing product work even though no `src/` file moves. Four
#   items reaching both a tool and the roadmap are set aside as a result, which
#   is the right answer: changing how the release train is *written* and
#   changing what it *says* are two jobs.
# - `docs/ARCHITECTURE.md` and `README.md` are written for a reader of the
#   simulator, which CLAUDE.md holds to the specialist standard.
#
# `docs/maintainer.md` is present for the same reason `docs/worker.md` is, and
# is said out loud because its absence read as a fifth entry on that list. Both
# are addressed to a participant in the build rather than to a reader of the
# simulator - worker.md to a session, maintainer.md to the person running them -
# and CLAUDE.md routes to both in the same breath. It was missing until
# `PL-GVNS`, which left `PL-90CJ` - whose only deliverable is a line in the
# owner's own notes - ranked in the product lane, offered to a simulator session
# and hidden from the apparatus one.
workflow_paths = [
  ".claude",
  ".github",
  ".gitignore",
  ".mailmap",
  "AGENTS.md",
  "CLAUDE.md",
  "CONTRIBUTING.md",
  "Makefile",
  "docket.toml",
  "docs/WORKING_NOTES.md",
  "docs/dead-ends.md",
  "docs/items",
  "docs/maintainer.md",
  "docs/worker.md",
  "subprojects",
  "tests/conftest.py",
  "tests/unit/test_agent_identity_check.py",
  "tests/unit/test_branch_id_check.py",
  "tests/unit/test_ci_concurrency.py",
  "tests/unit/test_contrast_check.py",
  "tests/unit/test_core_vocabulary_check.py",
  "tests/unit/test_dead_ends.py",
  "tests/unit/test_doc_check.py",
  "tests/unit/test_docket_branch_guard.py",
  "tests/unit/test_docket_digest_hook.py",
  "tests/unit/test_docket_gate.py",
  "tests/unit/test_fixture_id_check.py",
  "tests/unit/test_floor_interpreter_guard.py",
  "tests/unit/test_gate_status_guard.py",
  "tests/unit/test_glyph_check.py",
  "tests/unit/test_ignore_check.py",
  "tests/unit/test_main_ci_status.py",
  "tests/unit/test_import_boundary_check.py",
  "tests/unit/test_pr_body_check.py",
  "tests/unit/test_pr_record_check.py",
  "tests/unit/test_item_read_log.py",
